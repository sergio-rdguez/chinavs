<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<script>try{if(localStorage.getItem("china-tema")==="oscuro"){document.documentElement.dataset.tema="oscuro";document.querySelector('meta[name="theme-color"]').content="#0F172A"}}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="China">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Viaje a China</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ============================================================
   Estilo: paleta slate, tarjetas blancas redondeadas, acentos rojos
   y un color por ciudad (--c). Los tonos suaves salen de --c.
   ============================================================ */
:root{
  --bg:#F1F5F9; --surface:#FFFFFF; --soft:#F8FAFC; --ink:#0F172A; --text:#1E293B; --muted:#64748B; --faint:#94A3B8;
  --line:#E2E8F0; --line2:#F1F5F9;
  --red:#DC2626; --red7:#B91C1C; --red50:#FEF2F2; --red100:#FEE2E2;
  --blue:#2563EB; --blue7:#1D4ED8; --ok:#059669; --warn:#B45309; --rojo:#DC2626;
  --amb50:#FFFBEB; --amb200:#FDE68A; --amb9:#78350F;
  --sh:0 1px 2px rgba(15,23,42,.05); --sh2:0 10px 35px -10px rgba(15,23,42,.08);
  --c:#DC2626;
  --f:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif,"Apple Color Emoji","Segoe UI Emoji";
  --fm:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --fz:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
:root[data-tema="oscuro"]{--bg:#020617; --surface:#0F172A; --soft:#111C31; --ink:#F8FAFC; --text:#E2E8F0; --muted:#94A3B8; --faint:#64748B;
    --line:#1E293B; --line2:#162033; --red50:#2A0F12; --red100:#3B1216; --red7:#F87171;
    --blue:#3B82F6; --blue7:#60A5FA; --ok:#34D399; --warn:#FBBF24; --rojo:#F87171;
    --amb50:#2B2111; --amb200:#5C4516; --amb9:#FCD34D;
    --sh:0 1px 2px rgba(0,0,0,.4); --sh2:0 10px 35px -10px rgba(0,0,0,.6); color-scheme:dark}
/* Tonos de la ciudad: se recalculan en cada elemento que define --c */
:root,.th{--cs:color-mix(in srgb,var(--c) 8%,var(--surface));--cb:color-mix(in srgb,var(--c) 26%,var(--surface));--ct:color-mix(in srgb,var(--c) 82%,var(--ink))}
:root[data-tema="oscuro"],[data-tema="oscuro"] .th{--cs:color-mix(in srgb,var(--c) 16%,var(--surface));--cb:color-mix(in srgb,var(--c) 40%,var(--surface));--ct:color-mix(in srgb,var(--c) 55%,white)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--f);-webkit-font-smoothing:antialiased;min-height:100vh;
  padding-bottom:calc(92px + var(--sb));overscroll-behavior-y:none}
main{max-width:72rem;margin:0 auto;padding:12px}
main>section{display:none}
main>section.on{display:block;animation:entra .18s ease}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.fa-solid,.fa-regular,.fa-brands{line-height:1}
.pila{display:grid;gap:16px}
.n{display:block;color:var(--muted);font-size:12.5px;line-height:1.5;margin-top:2px}
p.n{margin-top:8px}
.zh{font-family:var(--fz);color:var(--ct)}
.mono{font-family:var(--fm)}

/* ---------- Cabecera de cristal ---------- */
.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);box-shadow:var(--sh);padding-top:var(--st)}
.top-in{max-width:72rem;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.marca{display:flex;align-items:center;gap:12px;min-width:0;background:none;border:0;padding:0;text-align:left}
.logo{width:40px;height:40px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;font:900 20px/1 var(--fz);
  box-shadow:0 4px 10px -2px rgba(220,38,38,.35);flex:none}
.mt{display:flex;align-items:center;gap:8px}
.mt h1{font-size:17px;font-weight:900;color:var(--ink);letter-spacing:-.01em;line-height:1}
.cuenta{border:0;cursor:pointer;display:inline-flex;align-items:center;gap:4px;border-radius:999px;background:var(--red50);padding:4px 10px;font-size:10px;font-weight:900;color:var(--red7);
  box-shadow:inset 0 0 0 1px var(--red100);white-space:nowrap}
.cuenta:empty{display:none}
.cuenta .vivo{width:7px;height:7px;border-radius:50%;background:#10B981;animation:late 1.6s infinite}
@keyframes late{50%{opacity:.35}}
.sub{font-size:12px;color:var(--muted);font-weight:500;margin-top:3px}
.acciones{display:none;gap:8px}
.acciones button{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  color:var(--text);transition:background .15s}
.acciones button i{color:var(--red)}
.acciones button:hover{background:var(--line2)}
.acciones button.on{background:var(--red);border-color:var(--red);color:#fff;box-shadow:var(--sh)}
.acciones button.on i{color:#fff}
.fases{max-width:72rem;margin:0 auto;padding:8px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line2)}
.fases::-webkit-scrollbar{display:none}
.fase{flex:none;display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:12px;font-size:12px;font-weight:700;white-space:nowrap;
  background:var(--surface);color:var(--ct);border:1px solid var(--cb);transition:background .15s}
.fase:hover{background:var(--cs)}
.fase.on{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 2px 8px -2px color-mix(in srgb,var(--c) 55%,transparent)}
.fase.hoy:not(.on)::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}

/* ---------- Barra inferior (móvil) ---------- */
nav.abajo{position:fixed;left:0;right:0;bottom:0;z-index:80;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;
  background:color-mix(in srgb,var(--surface) 95%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(15,23,42,.1);padding:8px 4px max(12px,var(--sb))}
nav.abajo button{min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;border-radius:12px;
  font-size:10px;font-weight:700;color:var(--muted);transition:background .18s,color .18s,transform .18s}
nav.abajo i{font-size:16px}
nav.abajo button.on{background:var(--red50);color:var(--red7)}
nav.abajo button:active{transform:scale(.94)}

/* ---------- Tarjetas y piezas comunes ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:16px}
.card.xl{border-radius:24px}
.card>h2:first-child,.card>.ch:first-child{margin-top:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
h2{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:900;color:var(--ink);letter-spacing:-.01em;margin:4px 0 12px}
h2 i{color:var(--ct);font-size:15px}
h2 small,.cuantos{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;letter-spacing:0}
.lbl{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:var(--ct);text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px}
.eyebrow{font-size:11px;font-weight:900;color:var(--red);text-transform:uppercase;letter-spacing:.2em}
.cab{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:20px}
.cab h1{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:900;color:var(--ink);letter-spacing:-.02em;line-height:1.15}
.cab h1 i{color:var(--red);font-size:20px}
.cab p{color:var(--muted);font-size:13px;margin-top:4px}
.cab .seg{margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;white-space:nowrap}
.pill.mono{font-family:var(--fm);background:var(--line2);color:var(--muted);border:1px solid var(--line)}
.chipzh{display:block;font:500 13px/1.6 var(--fz);color:var(--amb9);background:var(--amb50);border:1px solid var(--amb200);border-radius:12px;padding:8px 12px;margin-top:10px;word-break:break-word}

.btn{font:700 13px var(--f);min-height:40px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--line2);color:var(--text);
  display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;text-align:center;transition:filter .15s,transform .1s}
.btn:active{transform:scale(.96)}
.btn:hover{filter:brightness(.97)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;box-shadow:var(--sh)}
.btn.azul{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:var(--sh)}
.btn.verde{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{min-height:34px;padding:5px 12px;font-size:12px;border-radius:10px}
label.btn{margin:0;color:var(--text);cursor:pointer}
.btn.linea{width:100%;background:none;border:1.5px dashed var(--line);color:var(--muted)}
.btn.peligro{color:var(--rojo)}
.btn.ancho{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.acc{display:flex;flex-wrap:wrap;gap:8px}
.pie{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line2)}
.pie .btn{flex:1 1 auto}
.enl{background:none;border:0;padding:6px 0;color:var(--blue);font-size:13px;font-weight:600}
.alerta{display:flex;gap:10px;background:var(--amb50);border:1px solid var(--amb200);color:var(--amb9);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.5}
.alerta>i{margin-top:3px}
.alerta .enl{display:block;padding:4px 0 0;color:inherit;text-decoration:underline}
.vacio{color:var(--muted);padding:18px 4px;font-size:13px;text-align:center}

input[type=text],input[type=time],textarea,select{font:15px var(--f);width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);
  color:var(--ink);appearance:none;-webkit-appearance:none}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 18%,transparent)}
textarea{resize:vertical;line-height:1.45}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 5px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;align-items:end}
.dos>.btn{grid-column:1/-1;margin-top:10px;justify-self:start}
form>.btn{margin-top:12px}
.seg{display:flex;background:var(--line2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 10px;font-weight:700;font-size:12.5px;color:var(--muted);min-height:34px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg .on{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.seg.mini{flex:none}
.prog{background:var(--line2);border:1px solid var(--line);border-radius:12px;padding:14px}
.prog>div:first-child{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--text);margin-bottom:8px}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:999px;transition:width .3s}

/* ---------- Cabecera con foto ---------- */
.hero{position:relative;height:190px;border-radius:24px;overflow:hidden;background:var(--c);box-shadow:0 4px 14px -4px rgba(15,23,42,.25);color:#fff}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,.2) 55%,transparent);display:flex;flex-direction:column;justify-content:flex-end;padding:16px 18px}
.hero .badge{display:inline-flex;align-items:center;gap:6px;width:fit-content;background:var(--c);color:#fff;border-radius:999px;padding:3px 11px;font-size:10.5px;font-weight:800;
  text-transform:uppercase;letter-spacing:.06em;box-shadow:var(--sh);margin-bottom:6px}
.hero h1{font-size:30px;font-weight:900;letter-spacing:-.02em;line-height:1.05;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.hero .hf{font-size:13px;font-weight:600;opacity:.92;margin-top:4px}
.hero .hf::first-letter{text-transform:uppercase}
.hero .hm{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;font-weight:600;opacity:.9;margin-top:6px}
.hero .hm i{opacity:.8;margin-right:4px}
.hero .arriba{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;z-index:2}
.cristal{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;color:#fff;font-size:12.5px;font-weight:700;
  background:linear-gradient(135deg,rgba(15,23,42,.78),rgba(30,41,59,.68));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.28);box-shadow:0 4px 18px -2px rgba(0,0,0,.45),inset 0 1px 1px rgba(255,255,255,.35);text-decoration:none}
.cristal:active{transform:scale(.95)}
.cristal .mc{width:24px;height:24px}
.cristal b{font-size:15px;font-weight:900}
.credito{position:absolute;right:10px;bottom:6px;font-size:9px;opacity:.55;color:#fff;text-decoration:none;z-index:2}

/* ---------- Tira de días ---------- */
.tira{display:flex;gap:4px;overflow-x:auto;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);scrollbar-width:none}
.tira::-webkit-scrollbar{display:none}
.tira button{flex:0 0 46px;height:60px;border:0;background:none;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;position:relative}
.tira span{font-size:10px;font-weight:700;color:var(--faint);text-transform:uppercase}
.tira b{font-size:17px;font-weight:900;color:var(--ink);line-height:1.1}
.tira i{width:6px;height:6px;border-radius:50%;background:var(--dc)}
.tira .hoy{box-shadow:inset 0 0 0 2px var(--dc)}
.tira .on{background:var(--dc)}
.tira .on span,.tira .on b{color:#fff}
.tira .on i{background:#fff}

/* ---------- Ahora / después ---------- */
.ahora{background:var(--cs);border:1px solid var(--cb);border-radius:16px;padding:14px;display:grid;gap:12px}
.ahora>div{display:grid;grid-template-columns:34px 1fr;gap:2px 12px;align-items:center}
.ahora .ai{grid-row:1/4;width:34px;height:34px;border-radius:10px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:13px;box-shadow:var(--sh)}
.ahora .ai.gris{background:var(--surface);color:var(--ct);border:1px solid var(--cb)}
.ahora>div>:not(.ai){grid-column:2}
.ahora small{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--ct)}
.ahora b{font-size:15px;font-weight:800;color:var(--ink);line-height:1.25}
.ahora em{font-style:normal;color:var(--muted);font-size:12.5px}
.ahora .tr{border-top:1px solid var(--cb);padding-top:12px}

/* ---------- Tarjeta de un día ---------- */
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh);overflow:hidden}
.dcard>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line2);
  background:linear-gradient(to bottom,var(--soft),var(--surface))}
.dcard .dh{display:flex;align-items:center;gap:10px;min-width:0}
.dnum{width:40px;height:40px;border-radius:14px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;box-shadow:var(--sh)}
.dnum small{font-size:8px;font-weight:900;letter-spacing:.08em;opacity:.85;line-height:1}
.dnum b{font-size:14px;font-weight:900;line-height:1;margin-top:2px}
.dcard h3{font-size:15px;font-weight:900;color:var(--ink);line-height:1.2}
.dcard h3::first-letter{text-transform:uppercase}
.dcard .dt{font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.35;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dbad{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.vuelo{display:inline-flex;align-items:center;gap:4px;border-radius:999px;background:var(--blue);color:#fff;padding:2px 9px;font-size:10px;font-weight:900;letter-spacing:.05em}
.int{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600;color:var(--text);
  background:linear-gradient(135deg,color-mix(in srgb,var(--surface) 86%,transparent),color-mix(in srgb,var(--soft) 60%,transparent));
  border:1px solid var(--line);box-shadow:inset 0 1px 1px rgba(255,255,255,.6),var(--sh)}
.int .p{width:6px;height:6px;border-radius:50%;background:var(--ni)}
.int .bs{display:flex;gap:2px;align-items:center}
.int .bs i{width:3px;height:9px;border-radius:9px;background:color-mix(in srgb,var(--faint) 45%,transparent)}
.int .bs i.on{background:var(--ni)}
.tl{padding:6px 14px 10px}
.tl>.btn.linea{margin:8px 0 4px}

/* Línea de tiempo: hora, icono pastel y texto */
.it{display:grid;grid-template-columns:14px 58px 42px 1fr;gap:0 10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line2);
  padding:12px 0;position:relative;border-radius:0}
.it:last-of-type{border-bottom:0}
.it .tk{align-self:stretch;display:flex;flex-direction:column;align-items:center}
.it .tk::before,.it .tk::after{content:"";width:1px;flex:1;background:var(--line)}
.it .tk i{width:10px;height:10px;border-radius:50%;background:var(--faint);border:2px solid var(--surface);box-shadow:var(--sh);margin:3px 0;flex:none}
.it:first-of-type .tk::before,.it:last-of-type .tk::after{opacity:0}
.it .h{text-align:center;line-height:1.2}
.it .h b{display:block;font-size:13.5px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.it .h small{display:block;font-size:10.5px;color:var(--faint);font-weight:600;margin-top:2px;white-space:nowrap}
.ic{--h:#059669;width:42px;height:42px;border-radius:16px;display:grid;place-items:center;font-size:15px;flex:none;
  background:color-mix(in srgb,var(--h) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--h) 16%,var(--surface));color:var(--h);box-shadow:var(--sh)}
[data-tema="oscuro"] .ic{background:color-mix(in srgb,var(--h) 18%,var(--surface));border-color:color-mix(in srgb,var(--h) 32%,var(--surface));color:color-mix(in srgb,var(--h) 55%,white)}
.ic-indigo{--h:#4F46E5}.ic-blue{--h:#2563EB}.ic-sky{--h:#0284C7}.ic-cyan{--h:#0891B2}.ic-amber{--h:#D97706}.ic-purple{--h:#9333EA}.ic-rose{--h:#E11D48}.ic-emerald{--h:#059669}
.it .b{min-width:0}
.it .b b{display:block;font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.35}
.it .b .zh{display:inline-block;font-size:12px;font-weight:600;background:var(--cs);border:1px solid var(--cb);border-radius:999px;padding:0 8px;margin-top:3px}
.it .b .n{font-size:12px}
.it .km{color:var(--blue);font-weight:600}
.it.cur{background:var(--cs);border-radius:14px;border-bottom-color:transparent}
.it.cur .tk i{background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.it.cur .h b{color:var(--ct)}
.it.pas{opacity:.5}
.now{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;margin:4px 0}
.now span{font-size:10.5px;font-weight:900;color:#fff;background:var(--red);border-radius:999px;padding:2px 8px}
.now i{height:2px;background:var(--red);border-radius:2px}

/* ---------- Hotel ---------- */
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh2);padding:18px;display:flex;flex-direction:column}
.hcard .ht{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.hcard .hc{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:900;color:var(--ct);text-transform:uppercase;letter-spacing:.06em}
.hcard h3{font-size:16px;font-weight:900;color:var(--ink);line-height:1.3}
.hcard .pie{margin-top:auto}
.hcard .hp{font-size:13px;color:var(--text);margin-top:8px}
.hcard .hp b{font-weight:900}
.est{flex:none;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px}
.est.ok{color:#047857;background:#ECFDF5;border:1px solid #A7F3D0}
.est.pend{color:#B45309;background:#FFFBEB;border:1px solid #FDE68A}
[data-tema="oscuro"] .est.ok{color:#34D399;background:#052E22;border-color:#065F46}
[data-tema="oscuro"] .est.pend{color:#FBBF24;background:#2B2111;border-color:#5C4516}

/* ---------- Tiempo ---------- */
.wcard{position:relative;overflow:hidden;border-radius:24px;padding:16px;border:1px solid var(--line);
  background:linear-gradient(145deg,color-mix(in srgb,var(--surface) 94%,transparent),color-mix(in srgb,var(--surface) 78%,transparent));box-shadow:var(--sh2);width:100%;text-align:left;display:block}
.wcard::before,.wcard::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.wcard::before{top:-30%;right:-15%;width:220px;height:220px;background:radial-gradient(circle,rgba(251,191,36,.14),transparent 70%);animation:aura 7s ease-in-out infinite alternate}
.wcard::after{bottom:-35%;left:-15%;width:200px;height:200px;background:radial-gradient(circle,rgba(56,189,248,.12),transparent 70%);animation:aura 9s ease-in-out infinite alternate-reverse}
@keyframes aura{to{transform:translate(14px,-10px) scale(1.2)}}
.wcard>*{position:relative;z-index:1}
.wc{display:flex;gap:12px;align-items:stretch;justify-content:space-between}
.wc .ya{flex:1;min-width:130px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.wc .wl{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--text)}
.wc .wl i{color:var(--blue)}
.wc .gr{display:flex;align-items:center;gap:8px}
@media (max-width:420px){.wc .gr{gap:6px;white-space:nowrap}.wc .gr .mc{width:44px;height:44px}.wc .gr b{font-size:28px}.fmc{width:68px}.wc .ya{min-width:0}}
.wc .gr .mc{width:58px;height:58px;animation:flota 4.8s ease-in-out infinite}
@keyframes flota{50%{transform:translateY(-4px) rotate(2deg)}}
.wc .gr b{font-size:34px;font-weight:900;color:var(--ink);letter-spacing:-.03em;line-height:1}
.wc .gr span{font-size:15px;font-weight:500;color:var(--faint)}
.lluvia{display:inline-flex;align-items:center;gap:5px;width:fit-content;background:#EFF6FF;color:#2563EB;border:1px solid #BFDBFE;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:700}
[data-tema="oscuro"] .lluvia{background:#10213F;color:#93C5FD;border-color:#1E3A8A}
.wc .cond{font-size:12px;color:var(--muted)}
.fmcs{display:flex;gap:6px;flex:none}
.fmc{width:78px;padding:9px 5px;border-radius:18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;
  background:linear-gradient(180deg,#F0F9FF,color-mix(in srgb,var(--surface) 90%,transparent));border:1px solid #DBEAFE;box-shadow:0 2px 8px -2px rgba(15,23,42,.04)}
[data-tema="oscuro"] .fmc{background:linear-gradient(180deg,#0C1D33,var(--surface));border-color:#1E3A5F}
.fmc span{font-size:11.5px;font-weight:600;color:var(--muted)}
.fmc .mc{width:44px;height:44px;margin:2px 0}
.fmc b{font-size:16px;font-weight:900;color:var(--ink);line-height:1.1}
.fmc small{font-size:11px;color:var(--faint);font-weight:500}
.fmc em{font-style:normal;font-size:11px;font-weight:700;color:#2563EB;min-height:15px}
.fmc.vi{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.wnota{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:var(--muted);margin-top:12px;padding-top:10px;border-top:1px solid var(--line2)}
.mc{display:inline-block;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(15,23,42,.12))}
.pv{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:12px;padding-bottom:2px}
.pv::-webkit-scrollbar{display:none}
.pv .fmc{flex:none}
.pr{display:grid;grid-template-columns:1fr 36px 82px 44px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line2);font-size:13.5px}
.pr .mc{width:32px;height:32px}
.pr.vi>b{color:var(--ct)}
.pr b{font-weight:700}
.pr b::first-letter{text-transform:uppercase}
.pr .t{font-weight:800;text-align:right;color:var(--ink)}
.pr .ll{color:#2563EB;font-size:12px;font-weight:700;text-align:right}
.pr.cab{color:var(--faint);font-size:11px;font-weight:700;border-top:0;padding-bottom:2px;text-transform:uppercase;letter-spacing:.05em}
.ahw{display:flex;align-items:center;gap:14px;margin:12px 0 16px;padding:14px;border-radius:18px;background:var(--soft);border:1px solid var(--line)}
.ahw .mc{width:64px;height:64px}
.ahw b{font-size:44px;font-weight:900;color:var(--ink);line-height:1;letter-spacing:-.03em}
.ahw .n{margin:0}

/* ---------- Viaje: mapa y paradas ---------- */
.ruta{display:grid;gap:14px}
.paradas{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:10px}
.paradas>h3{font-size:14px;font-weight:900;color:var(--ink);padding:6px 8px 8px}
.parada{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:10px;transition:background .15s}
.parada:hover{background:var(--cs)}
.parada .num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:900}
.parada.hoy .num{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}
.parada b{display:block;font-size:14px;font-weight:900;color:var(--ink)}
.parada .fe{display:block;font-size:11px;font-weight:700;color:var(--ct);margin-top:1px}
.parada .no{display:block;font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.hls{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.hl{display:inline-flex;align-items:center;gap:4px;border-radius:999px;background:var(--line2);border:1px solid var(--line);padding:1px 8px;font-size:10.5px;font-weight:600;color:var(--muted)}
.hl i{color:#F59E0B;font-size:8px}
.ver{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--ct);margin-top:8px}
.parada .ft{flex:none;width:58px;height:58px;border-radius:14px;object-fit:cover;margin-left:auto;background:var(--c)}
.dia{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:11px 4px;border-top:1px solid var(--line2);font-size:13.5px}
.dia:first-child{border-top:0}
.dd{background:var(--cs);border:1px solid var(--cb);border-radius:12px;padding:5px 0;text-align:center;align-self:start}
.dd b{display:block;font-size:17px;font-weight:900;color:var(--ct);line-height:1.1}
.dd span{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase}
.dia.hoy .dd{background:var(--c);border-color:var(--c)}
.dia.hoy .dd b,.dia.hoy .dd span{color:#fff}
.dia.pas{opacity:.55}
.cd{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:900;color:var(--ct);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 6px}
.cd:first-child{margin-top:4px}
.cd span{font:700 15px var(--fz)}
.lista{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.lista li{display:flex;gap:8px;font-size:13px;align-items:baseline}
.lista li i{color:var(--warn);font-size:11px}

.mapa{padding:8px 8px 12px}
.mapa svg{display:block;width:100%;height:auto;max-height:420px}
.mapa path{fill:none;stroke:var(--faint);stroke-width:1.8;stroke-linecap:round}
.mapa .vu{stroke-dasharray:2 6}
.mapa .cn{font:700 12.5px var(--f);fill:var(--ink)}
.mapa .cz{font:12px var(--fz);fill:var(--muted)}
.mapa .nn{font:800 9px var(--f);fill:#fff;text-anchor:middle}
.ley{display:flex;gap:18px;justify-content:center;font-size:12px;color:var(--muted)}
.ley span{display:flex;align-items:center;gap:6px}
.ley i{width:22px;border-top:2px solid var(--faint)}
.ley .l2{border-top-style:dotted;border-top-width:3px}
.lmap{position:relative;z-index:0;border-radius:16px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh)}
.lmap.on{height:380px}
.lmap>.n{padding:40px 16px;text-align:center;margin:0}
.lmap.leaflet-container{font:12px var(--f)}
[data-tema="oscuro"] .lmap .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}
.pin span{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#fff;font:900 11px/1 var(--f);border:2px solid #fff;box-shadow:0 2px 6px rgba(15,23,42,.35)}
.leaflet-tooltip.tt{font:800 10.5px var(--f);padding:3px 8px;border-radius:999px;border:1px solid #CBD5E1;color:#1E293B;box-shadow:0 2px 7px rgba(15,23,42,.16)}

/* ---------- Ciudad: qué ver, comer y consejos ---------- */
.dos-col{display:grid;gap:14px}
.lgs{display:grid;gap:8px}
.lgs button{display:grid;grid-template-columns:26px 1fr auto;gap:2px 10px;align-items:center;text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;transition:border-color .15s}
.lgs button:hover{border-color:var(--cb)}
.lgs .nn{grid-row:1/3;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font:900 11px/26px var(--f);text-align:center}
.lgs b{font-weight:800;font-size:13.5px;color:var(--ink)}
.lgs .zh{font-size:12.5px;text-align:right;font-weight:600}
.lgs small{grid-column:2/-1;color:var(--muted);font-size:11.5px}
.foods{display:grid;gap:10px}
.food{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px;width:100%}
.food b{font-size:14px;font-weight:900;color:var(--ink)}
.food .zh{display:inline-flex;align-items:center;gap:6px;width:fit-content;font-size:14px;font-weight:700;background:var(--cs);border:1px solid var(--cb);border-radius:999px;padding:2px 10px}
.food .zh small{font:600 11px var(--f);color:var(--muted)}
.food p{font-size:12px;color:var(--muted);line-height:1.5}
.food .ver{margin-top:2px}
.tips{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.tips li{display:flex;gap:10px;font-size:13px;line-height:1.5;align-items:flex-start}
.tips li i{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--cs);color:var(--ct);font-size:11px;margin-top:1px}
.picante{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ct);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}

/* ---------- Reservas ---------- */
.rgrid{display:grid;gap:14px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:18px;display:flex;flex-direction:column}
.tcard .tt{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.tipo{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:800}
.tipo.av{background:#E0F2FE;color:#075985}.tipo.tr{background:#FEF3C7;color:#92400E}
[data-tema="oscuro"] .tipo.av{background:#0C2A40;color:#7DD3FC}
[data-tema="oscuro"] .tipo.tr{background:#2B2111;color:#FCD34D}
.tcard h4{font-size:15px;font-weight:900;color:var(--ink)}
.caja{margin-top:10px;padding:12px;background:var(--soft);border:1px solid var(--line);border-radius:12px;font-size:12.5px}
.caja b{font-weight:700;color:var(--text)}
.loc{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:#EFF6FF;color:#1D4ED8;border:1px solid #BFDBFE;border-radius:10px;padding:4px 10px;font:700 12px var(--fm)}
[data-tema="oscuro"] .loc{background:#10213F;color:#93C5FD;border-color:#1E3A8A}
.ent{display:grid}
.ent label{display:flex;gap:12px;align-items:flex-start;margin:0;padding:12px 8px;border-bottom:1px solid var(--line2);border-radius:12px;font-size:13.5px;color:var(--text);cursor:pointer;transition:background .15s}
.ent label:hover{background:var(--soft)}
.ent input,.chk input{flex:none;width:20px;height:20px;margin:1px 0 0;accent-color:var(--red);cursor:pointer}
.ent span{flex:1;min-width:0}
.ent b{display:block;font-weight:800;color:var(--ink)}
.ent .zh{font-size:12.5px;margin-left:4px;font-weight:600}
.ent small{display:block;font-size:11.5px;font-weight:600;color:var(--red);margin-top:2px}
.ent em{flex:none;max-width:40%;font:700 12px var(--fm);font-style:normal;color:var(--text);text-align:right}
.ent input:checked~span b{color:var(--muted);text-decoration:line-through}

/* ---------- Gastos ---------- */
.gf{display:grid;gap:12px}
.imp{display:flex;gap:10px;align-items:center}
#gI{font:900 40px/1.1 var(--f);letter-spacing:-.03em;border:0;background:none;padding:0;min-width:0;flex:1;color:var(--ink);box-shadow:none}
.conv{color:var(--muted);font-size:12.5px;margin-top:-6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--muted);min-height:34px}
.chips .on{background:var(--red);border-color:var(--red);color:#fff}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:14px}
.kpi small{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi b{display:block;font-size:22px;font-weight:900;color:var(--ink);margin-top:4px;letter-spacing:-.02em}
.bl{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:12.5px;font-weight:600;margin:8px 0}
.bl b{font-weight:800;color:var(--ink)}
.gd{display:flex;justify-content:space-between;font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 4px}
.gd:first-child{margin-top:0}
.g{display:grid;grid-template-columns:34px 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line2)}
.g .gc{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:13px}
.g b{font-weight:700;font-size:13.5px;color:var(--ink)}
.gi{text-align:right}
.gi b{font-weight:900}
.g .enl{color:var(--faint);padding:6px}

/* ---------- Kit ---------- */
.chk label{display:flex;gap:12px;align-items:flex-start;margin:0;padding:11px 4px;border-bottom:1px solid var(--line2);font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer}
.chk input:checked+span{color:var(--faint);text-decoration:line-through}
.add{display:flex;gap:8px;margin-top:12px}
.add .btn{margin:0;flex:none}
.cv input{font:900 24px var(--f)}
.cv .n{font-size:13.5px;margin-top:10px;line-height:1.7}
.cv .n b{color:var(--ink);font-weight:800}
.fg{font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 8px}
.fr{display:grid;gap:8px}
.fr button{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;align-items:baseline}
.fr span{font-size:13.5px;font-weight:700;color:var(--ink)}
.fr b{font:700 17px var(--fz);color:var(--ct);text-align:right}
.fr i{grid-column:1/-1;font-style:normal;font-size:11.5px;color:var(--muted)}
.em{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.em a{border-radius:16px;padding:14px;text-decoration:none;font-size:12px;font-weight:700;border:1px solid;display:flex;flex-direction:column;gap:4px}
.em a b{font-size:24px;font-weight:900;line-height:1}
.em a i{font-size:14px}
.em .e1{background:#FEF2F2;border-color:#FECACA;color:#991B1B}.em .e2{background:#FFFBEB;border-color:#FDE68A;color:#92400E}
.em .e3{background:#FFF7ED;border-color:#FED7AA;color:#9A3412}.em .e4{background:#F0F9FF;border-color:#BAE6FD;color:#075985}
[data-tema="oscuro"] .em .e1{background:#2A0F12;border-color:#5B1A1F;color:#FCA5A5}
[data-tema="oscuro"] .em .e2{background:#2B2111;border-color:#5C4516;color:#FCD34D}
[data-tema="oscuro"] .em .e3{background:#2B1608;border-color:#5C3112;color:#FDBA74}
[data-tema="oscuro"] .em .e4{background:#0C2A40;border-color:#164E63;color:#7DD3FC}
.seguro{position:relative;overflow:hidden;border-radius:24px;padding:22px;color:#fff;background:linear-gradient(135deg,#B91C1C,#DC2626 55%,#F97316);box-shadow:0 8px 24px -8px rgba(220,38,38,.45)}
.seguro .fondo{position:absolute;right:-20px;top:-30px;font-size:150px;opacity:.1}
.seguro h2{color:#fff;margin:0;font-size:22px}
.seguro h2 i{color:#fff}
.seguro p{color:#FEE2E2;font-size:12.5px;margin-top:4px;position:relative}
.seguro .acc{margin-top:14px;position:relative}
.seguro .btn{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35);color:#fff}
.docs{display:grid;gap:8px}
.doc{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);background:var(--soft);border-radius:12px}
.doc>span{display:flex;align-items:center;gap:10px;font-weight:700;font-size:13.5px;color:var(--ink)}
.doc>span i{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:#EFF6FF;color:#2563EB;font-size:13px}
[data-tema="oscuro"] .doc>span i{background:#10213F;color:#93C5FD}
.doc .acc{flex:none}
.ajuste{display:flex;gap:12px;align-items:flex-start}
.ajuste>i{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--line2);color:var(--muted)}

/* ---------- Hoja inferior ---------- */
dialog{margin:auto auto 0;width:100%;max-width:640px;max-height:90dvh;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:0;background:color-mix(in srgb,var(--surface) 96%,transparent);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:var(--text);box-shadow:0 -10px 40px rgba(15,23,42,.25)}
dialog[open]{animation:sube .28s cubic-bezier(.16,1,.3,1)}
@keyframes sube{from{transform:translateY(40px);opacity:0}}
dialog::backdrop{background:rgba(2,6,23,.6);backdrop-filter:blur(3px)}
#dlgB{position:relative;padding:12px 20px calc(24px + var(--sb));overflow-y:auto;max-height:90dvh}
#dlgB::before{content:"";display:block;width:48px;height:6px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.dlg-x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:12px;border:0;background:var(--line2);color:var(--muted);display:grid;place-items:center;z-index:2}
#dlgB h3{font-size:22px;font-weight:900;color:var(--ink);letter-spacing:-.02em;padding-right:40px;line-height:1.2}
.dk{display:flex;align-items:center;gap:6px;color:var(--blue);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.dh{font-size:15px;font-weight:800;color:var(--muted);margin:4px 0 10px}
.lugar{margin-top:14px;padding:14px;background:var(--soft);border:1px solid var(--line);border-radius:16px}
.zhG{font:700 32px/1.2 var(--fz);color:var(--ct);margin-bottom:6px}
.lugar b{font-weight:800;color:var(--ink)}
.lugar dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:10px 0 0;font-size:13.5px}
.lugar dt{color:var(--muted);font-size:12px;font-weight:700;padding-top:1px}
.lugar dd{margin:0}

/* ---------- Pantalla grande para enseñar ---------- */
#grande{position:fixed;inset:0;z-index:140;background:#fff;color:#000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--st) + 64px) 22px calc(var(--sb) + 30px);text-align:center;overflow:auto}
#grande.on{display:flex}
#grande .x{position:absolute;top:calc(var(--st) + 12px);right:14px;border:1px solid #CBD5E1;background:#fff;color:#0F172A;border-radius:12px;padding:9px 14px;font-weight:800}
.gz{font:700 clamp(42px,14vw,88px)/1.25 var(--fz);white-space:pre-line}
.gz.lg{font-size:clamp(30px,9.5vw,58px)}
.gp{font-size:20px;color:#475569;margin-top:14px}
.gs{font-size:16px;color:#64748B;margin-top:22px;max-width:30em}
#grande img{max-width:100%;max-height:100%;object-fit:contain}

/* ---------- Avisos ---------- */
#pend{position:fixed;top:calc(var(--st) + 70px);right:12px;z-index:60;background:var(--amb50);color:var(--amb9);border:1px solid var(--amb200);font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;display:none}
#pend.on{display:block}
#aviso{position:fixed;left:50%;bottom:calc(100px + var(--sb));transform:translateX(-50%);z-index:150;max-width:88vw;background:#0F172A;color:#fff;padding:10px 16px;border-radius:12px;
  font-size:13px;font-weight:600;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 10px 30px -6px rgba(0,0,0,.4)}
#aviso.on{opacity:1}

/* ---------- Presentación con cuenta atrás ---------- */
#intro{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#B91C1C;color:#fff;text-align:center;padding:24px;
  animation:introIn .7s cubic-bezier(.22,1,.36,1) both}
#intro::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at top right,rgba(255,255,255,.2),transparent 35%),radial-gradient(circle at bottom left,rgba(127,29,29,.55),transparent 45%)}
#intro>div{position:relative}
#intro .s{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.3em;color:#FEE2E2}
#intro .p{margin-top:24px;font-size:19px;font-weight:600;color:#FEF2F2}
#intro strong{display:block;margin-top:4px;font-size:clamp(4.5rem,18vw,11rem);font-weight:900;line-height:1;letter-spacing:-.03em;animation:pulso 1.8s ease-in-out infinite}
#intro strong.txt{font-size:clamp(2.5rem,8vw,5rem);line-height:1.1}
#intro .l{margin-top:8px;font-size:17px;font-weight:700;color:#FEE2E2}
#intro .f{margin-top:24px;font-size:12px;font-weight:500;color:rgba(254,226,226,.8)}
#intro.sale{animation:introOut .9s ease forwards;pointer-events:none}
@keyframes introIn{from{opacity:0;transform:scale(1.04)}}
@keyframes introOut{to{opacity:0;transform:scale(.96);filter:blur(10px);visibility:hidden}}
@keyframes pulso{50%{transform:translateY(-6px)}}
.cuenta.llega{animation:llega .7s cubic-bezier(.22,1,.36,1) both}
@keyframes llega{from{opacity:0;transform:translateY(12px) scale(.85)}}

@media (min-width:640px){
  body{padding-bottom:32px}

}
@media (min-width:768px){.hero{height:290px}}

  .hero{height:320px}

}

}

function aplicar(d,op){
  if(op.action==="update"){
    const r=(d[op.sheet.toLowerCase()]||[]).find(x=>x._row===op.row);
    if(r) Object.assign(r,op.values);
  }else if(op.action==="check"){
    const r=d.checklist.find(x=>x._row===op.row); if(r) r.Hecho=op.done;
  }else if(op.action==="addTask"){
    if(!d.checklist.some(c=>c.Tarea===op.text)) d.checklist.push({Tarea:op.text,Hecho:false});
  }else if(op.action==="upsert"){
    const L=d[TABLA[op.sheet]],r=L.find(x=>x.ID===op.id);
    if(r) Object.assign(r,op.values); else L.push({ID:op.id,...op.values});
  }else if(op.action==="remove"){
    const k=TABLA[op.sheet]; d[k]=d[k].filter(x=>x.ID!==op.id);
  }
}

  const d=clon(SERVER||INICIAL),nuevo=(d.version||1)>=2;

  d.agenda=nuevo&&d.agenda&&d.agenda.length?d.agenda:clon(SEED_AGENDA);
  d.lugares=nuevo&&d.lugares&&d.lugares.length?d.lugares:clon(SEED_LUGARES);
  QUEUE.forEach(op=>aplicar(d,op));

  });
}

    for(const [hoja,rows] of [["Lugares",SEED_LUGARES],["Agenda",SEED_AGENDA]]){

  try{
    let i=0;
    while(i<QUEUE.length){
      const op=QUEUE[i];
      if(SOLO_V2.has(op.action)&&!v2()){i++;continue}       // espera a que se actualice el script
      let j;
      try{

        j=await r.json();
      }catch(e){syncEstado="sin";break}

      if(j&&j.error) aviso("Un cambio no se ha guardado: "+j.error);

async function pedirCambio(){

function icono(x){
  const t=x.titulo;
  if(x.tipo==="vuelo") return ["fa-plane","ic-sky"];
  if(x.tipo==="tren") return ["fa-train-subway","ic-blue"];

  if(x.tipo==="comida"||/\b(cena|comida|desayuno|almuerzo)\b/i.test(t)) return ["fa-utensils","ic-amber"];
  if(x.tipo==="traslado") return ["fa-bus","ic-blue"];

  if(x.tipo==="libre") return ["fa-person-walking","ic-emerald"];

}
function intensidad(items){                     // exigencia física aproximada: horas de visita y madrugón
  if(!items.length) return "";

  let n=m<150?1:m<270?2:m<390?3:m<510?4:5;
  const pr=items.find(x=>x.t!=null); if(pr&&pr.t<8*60&&n<5) n++;
  const [lab,col]=[["Suave","#10B981"],["Ligero","#10B981"],["Moderado","#F59E0B"],["Exigente","#F97316"],["Intenso","#F43F5E"]][n-1];

}

    const dx=esHoy&&est!=="pas"&&x!==aqui?dist(x.lugar):null,p=x.lugar,[fa,col]=icono(x);
    if(esHoy&&!marcado&&x.t!=null&&x.t>now.min){marcado=true;h+=`<div class="now"><span>${fmtMin(now.min)}</span><i></i></div>`}
    h+=`<button class="it ${est}" data-item="${esc(x.k)}" data-di="${i}">
      <span class="tk"><i></i></span>
      <span class="h"><b>${x.t!=null?fmtMin(x.t):"--:--"}</b>${x.t!=null&&x.fin!=null&&x.fin>x.t?`<small>${durTxt(x.fin-x.t)}</small>`:""}</span>
      <span class="ic ${col}"><i class="fa-solid ${fa}"></i></span>
      <span class="b"><b>${esc(x.titulo)}</b>${p&&p.zh?`<span class="zh">${esc(p.zh)}</span>`:""}
        ${p&&p.hotel?`<span class="n">${esc(p.nombre)}</span>`:""}${x.notas?`<span class="n">${esc(x.notas)}</span>`:""}
        ${dx!=null&&dx<150?`<span class="n km"><i class="fa-solid fa-location-arrow"></i> A ${kmTxt(dx)} de aquí</span>`:""}</span>

/* ---------- HOY ---------- */
function rHoy(){
  const now=ahoraCN(),hoyI=diaActual(now);
  if(sel==null||(!selManual&&hoyI>=0)) sel=hoyI>=0?hoyI:(now.iso>DIAS[DIAS.length-1].iso?DIAS.length-1:0);
  sel=Math.min(sel,DIAS.length-1);
  const d=DIAS[sel],c=ciudad(d.Ciudad),esHoy=d.iso===now.iso,items=itemsDia(d.iso);
  document.documentElement.style.setProperty("--c",c.c);
  const falta=diasEntre(now.iso,DIAS[0].iso);
  if(Math.abs(diasEntre(now.iso,d.iso))<=15&&!FAKE) pedirClima(d.ck);
  const gk=ciudadGPS(),conSitio=p=>p&&p.lat&&!p.hotel;
  const dist=p=>POS&&conSitio(p)?distKm(POS.lat,POS.lon,p.lat,p.lon):null;
  let aqui=null;                              // plan de hoy en cuyo lugar estáis (a menos de 600 m)
  if(esHoy&&POS){
    aqui=items.filter(x=>dist(x.lugar)!=null&&dist(x.lugar)<=0.6)
      .sort((a,b)=>Math.abs((a.t??0)-now.min)-Math.abs((b.t??0)-now.min))[0]||null;
  }

  const cuando=esHoy?"Hoy":falta>0&&sel===0?(falta===1?"Mañana empieza":`Faltan ${falta} días`):d.iso<now.iso?"Ya pasó":"";
  let html=`<div class="pila">`+heroFoto(d.ck,{badge:`Día ${sel+1} de ${DIAS.length}${cuando?" · "+cuando:""}`,titulo:c.n,
      sub:fecha(d.iso,{weekday:"long",day:"numeric",month:"long"}),
      hm:`<span><i class="fa-regular fa-clock"></i>China ${fmtMin(now.min)}</span><span><i class="fa-solid fa-house"></i>Madrid ${horaMadrid(now)}</span>`,
      izq:CIUDADES[d.ck]?`<button class="cristal" data-ciudad="${d.ck}"><i class="fa-solid fa-book-open"></i>Guía</button>`:"",
      der:CIUDADES[d.ck]?pildoraClima(d.ck,d.iso):""})+
    `<div class="tira" id="tira">${DIAS.map((x,i)=>`<button data-dia="${i}" class="${i===sel?"on":""}${x.iso===now.iso?" hoy":""}" style="--dc:${ciudad(x.Ciudad).c}" aria-label="Día ${i+1}, ${esc(x.Ciudad)}">
      <span>${fecha(x.iso,{weekday:"short"}).slice(0,2)}</span><b>${D(x.iso).getDate()}</b><i></i></button>`).join("")}</div>`;

  /* La ubicación manda sobre el plan */
  if(esHoy&&gk&&gk!==d.ck){
    const otro=DIAS.findIndex(x=>x.ck===gk&&x.iso>=now.iso),ir=otro>=0?otro:DIAS.findIndex(x=>x.ck===gk);
    html+=`<div class="alerta"><i class="fa-solid fa-location-crosshairs"></i><div>Estáis en ${esc(CIUDADES[gk].n)}, pero el plan de hoy es ${esc(c.n)}.
      ${ir>=0?`<button class="enl" data-ir="${ir}">Ver el plan de ${esc(CIUDADES[gk].n)}</button>`:""}</div></div>`;
  }

  /* Ahora y después */
  if(esHoy){
    const conHora=items.filter(x=>x.t!=null);
    const porReloj=[...conHora].reverse().find(x=>x.t<=now.min&&now.min<(x.fin??(conHora[conHora.indexOf(x)+1]||{}).t??x.t+60));
    const actual=aqui||porReloj;
    const sig=aqui?conHora[conHora.indexOf(aqui)+1]:conHora.find(x=>x.t>now.min),tr=proximoTrayecto(now);   // estando en un sitio, lo siguiente es lo que va detrás en el plan
    const dSig=sig?dist(sig.lugar):null;
    html+=`<div class="ahora">
      ${actual?`<div><span class="ai"><i class="fa-solid ${aqui?"fa-location-dot":"fa-play"}"></i></span><small>${aqui?"Estáis aquí":"Ahora"}</small><b>${esc(actual.titulo)}</b>${actual.fin&&actual.fin>now.min?`<em>hasta las ${fmtMin(actual.fin)}</em>`:""}</div>`
              :`<div><span class="ai"><i class="fa-solid fa-mug-hot"></i></span><small>Ahora</small><b>${sig?"Tiempo libre":"Fin del plan de hoy"}</b></div>`}
      ${sig?`<div><span class="ai gris"><i class="fa-solid fa-forward"></i></span><small>${sig.t>now.min?`Después, en ${durTxt(sig.t-now.min)}`:`Después. Vais ${durTxt(now.min-sig.t)} por detrás del plan`}</small><b>${esc(sig.titulo)}</b><em>a las ${fmtMin(sig.t)}${dSig!=null&&dSig<150?`, a ${kmTxt(dSig)} de aquí`:""}</em></div>`:""}
      ${tr?`<div class="tr"><span class="ai gris"><i class="fa-solid ${/vuelo/i.test(tr.t.Tipo)?"fa-plane":"fa-train-subway"}"></i></span><small>Próximo trayecto, en ${durTxt(tr.falta)}</small><b>${esc(tr.t.Origen)} → ${esc(tr.t.Destino)}</b>
        <em>${fecha(tr.iso,{weekday:"short",day:"numeric",month:"short"})}${tr.s!=null?" a las "+fmtMin(tr.s):""}</em></div>`:""}
    </div>`;
  }

  html+=htmlDia(sel,{vivo:true,aqui,dist});
  if(!geoActiva()) html+=`<button class="enl" data-act="geo" style="justify-self:center"><i class="fa-solid fa-location-arrow"></i> Usar mi ubicación para ajustar el plan</button>`;

  /* Dónde se duerme */
  const h=hotelNoche(d.iso);
  if(h) html+=`<div><p class="lbl"><i class="fa-solid fa-moon"></i>Esta noche</p>${tarjetaHotel(h)}</div>`;

  /* Diario */
  const nota=DATA.diario.find(x=>toISO(x.Fecha)===d.iso);
  html+=`<section class="card"><h2><i class="fa-solid fa-book"></i>Diario del día</h2>
    <form data-form="diario"><textarea id="diarioT" rows="3" placeholder="Lo mejor de hoy, lo que no queréis olvidar…">${esc(nota?nota.Nota:"")}</textarea>
    <button class="btn pri"><i class="fa-solid fa-floppy-disk"></i>Guardar nota</button></form></section></div>`;

  $("s-hoy").innerHTML=html;
  const b=$("tira").querySelector(".on"); if(b) $("tira").scrollLeft=b.offsetLeft-$("tira").clientWidth/2+b.offsetWidth/2;
  rCabecera();
}

    if(pill.innerHTML&&b.width&&!matchMedia("(prefers-reduced-motion: reduce)").matches){   // el número vuela hasta la píldora de la cabecera
      const v=num.cloneNode(true);v.removeAttribute("id");
      Object.assign(v.style,{position:"fixed",left:a.left+"px",top:a.top+"px",width:a.width+"px",margin:0,zIndex:110,color:"#fff",pointerEvents:"none",
        transition:"transform .9s cubic-bezier(.22,1,.36,1),opacity .9s ease",transformOrigin:"top left",animation:"none"});
      document.body.append(v);num.style.opacity=0;
      requestAnimationFrame(()=>requestAnimationFrame(()=>{v.style.transform=`translate(${b.left-a.left}px,${b.top-a.top}px) scale(${Math.min(b.width/a.width,b.height/a.height)})`;v.style.opacity=0}));
      setTimeout(()=>{v.remove();pill.classList.add("llega")},900);

function mapaRuta(now){
  const ks=[...new Set(DIAS.map(d=>d.ck))].filter(k=>CIUDADES[k]);
  const X=lon=>(lon-101)/22.5*290+20+(lon>114.1&&lon<114.3?9:0),Y=lat=>(41.2-lat)/20.4*330+20+(lat>22.2&&lat<22.4?9:0);   // Hong Kong se separa un poco de Shenzhen
  const pos={pekin:[12,5,"start"],xian:[-12,5,"end"],shanghai:[12,5,"start"],zhangjiajie:[-12,5,"end"],yangshuo:[-12,5,"end"],shenzhen:[-12,0,"end"],hongkong:[13,8,"start"]};
  const hoyK=(DIAS[diaActual(now)]||{}).ck;
  let s=`<svg viewBox="0 0 400 372" role="img" aria-label="Mapa esquemático de la ruta">`;
  ks.forEach((k,i)=>{
    if(!i) return;
    const a=CIUDADES[ks[i-1]],b=CIUDADES[k],t=DATA.transporte.find(t=>claveCiudad(t.Destino)===k);
    const vuelo=t&&/vuelo/i.test(t.Tipo),x1=X(a.lon),y1=Y(a.lat),x2=X(b.lon),y2=Y(b.lat);
    const mx=(x1+x2)/2+(vuelo?(y2-y1)*.18:0),my=(y1+y2)/2-(vuelo?(x2-x1)*.18:0);
    s+=`<path d="M${x1},${y1} Q${mx},${my} ${x2},${y2}" class="${vuelo?"vu":"tr"}"/>`;
  });
  ks.forEach((k,i)=>{
    const c=CIUDADES[k],x=X(c.lon),y=Y(c.lat),[dx,dy,an]=pos[k]||[12,5,"start"];
    s+=`${k===hoyK?`<circle cx="${x}" cy="${y}" r="13" fill="${c.c}" opacity=".2"/>`:""}
      <circle cx="${x}" cy="${y}" r="7" fill="${c.c}"/><text x="${x}" y="${y+3.5}" class="nn">${i+1}</text>
      <text x="${x+dx}" y="${y+dy}" text-anchor="${an}" class="cn">${esc(c.n)} <tspan class="cz">${c.zh}</tspan></text>`;
  });
  return s+`</svg><p class="ley"><span><i class="l1"></i>Tren</span><span><i class="l2"></i>Vuelo</span></p>`;
}

function defMapa(){
  if(!ciudadSel){
    const ks=[...new Set(DIAS.map(d=>d.ck))].filter(k=>CIUDADES[k]);
    return {tipo:"viaje",hoy:(DIAS[diaActual(ahoraCN())]||{}).ck||null,
      pts:ks.map((k,i)=>({k,n:i+1,lat:CIUDADES[k].lat,lon:CIUDADES[k].lon,c:CIUDADES[k].c,t:CIUDADES[k].n})),
      lin:ks.slice(1).map((k,i)=>{const t=DATA.transporte.find(t=>claveCiudad(t.Destino)===k);return {a:ks[i],b:k,v:!!(t&&/vuelo/i.test(t.Tipo))}})};
  }
  const c=CIUDADES[ciudadSel],g={};
  lugaresCiudad(ciudadSel).forEach(x=>{
    const la=parseFloat(x.l.Lat),lo=parseFloat(x.l.Lon); if(!la||!lo) return;
    const p=g[la+","+lo]||(g[la+","+lo]={lat:la,lon:lo,n:[],t:[],id:x.l.ID,iso:x.o&&x.o.iso});   // sitios con las mismas coordenadas comparten chincheta
    p.n.push(x.n);p.t.push(x.l.Nombre);
  });
  const pts=Object.values(g),dias={};
  pts.forEach(p=>{if(p.iso)(dias[p.iso]=dias[p.iso]||[]).push([p.lat,p.lon])});
  return {tipo:"ciudad",c:c.c,centro:[c.lat,c.lon],pts,lin:Object.values(dias).filter(l=>l.length>1)};
}
function curva(a,b){                          // los vuelos se dibujan en arco
  const mla=(a.lat+b.lat)/2-(b.lon-a.lon)*.18,mlo=(a.lon+b.lon)/2+(b.lat-a.lat)*.18,out=[];
  for(let i=0;i<=20;i++){const t=i/20;out.push([(1-t)**2*a.lat+2*(1-t)*t*mla+t*t*b.lat,(1-t)**2*a.lon+2*(1-t)*t*mlo+t*t*b.lon])}
  return out;
}
function dibujarMapa(map,def){
  const oscuro=document.documentElement.dataset.tema==="oscuro",gris=oscuro?"#9AA1AA":"#636973";
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,
    attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
  const pin=(txt,col)=>L.divIcon({className:"pin",html:`<span style="background:${col}">${txt}</span>`,iconSize:[24,24],iconAnchor:[12,12]});
  if(def.tipo==="viaje"){
    const P=Object.fromEntries(def.pts.map(p=>[p.k,p]));
    def.lin.forEach(l=>{const a=P[l.a],b=P[l.b];
      L.polyline(l.v?curva(a,b):[[a.lat,a.lon],[b.lat,b.lon]],{color:gris,weight:2.5,dashArray:l.v?"3 7":null,interactive:false}).addTo(map)});
    def.pts.forEach(p=>{
      const izq=p.lon<113||p.k==="shenzhen";
      if(p.k===def.hoy) L.circleMarker([p.lat,p.lon],{radius:20,stroke:false,fillColor:p.c,fillOpacity:.25,interactive:false}).addTo(map);
      L.marker([p.lat,p.lon],{icon:pin(p.n,p.c),title:p.t}).addTo(map)
        .bindTooltip(esc(p.t),{permanent:true,direction:izq?"left":"right",offset:[izq?-10:10,0],className:"tt"})
        .on("click",()=>{location.hash="viaje/"+p.k});
    });
    map.fitBounds(def.pts.map(p=>[p.lat,p.lon]),{padding:[30,30]});
  }else{
    def.lin.forEach(l=>L.polyline(l,{color:def.c,weight:3,opacity:.5,interactive:false}).addTo(map));
    def.pts.forEach(p=>L.marker([p.lat,p.lon],{icon:pin(p.n[0]+(p.n.length>1?"+":""),def.c),title:p.t.join(", ")}).addTo(map)
      .bindTooltip(p.t.map(esc).join("<br>"),{direction:"top",offset:[0,-12],className:"tt"}).on("click",()=>detalleLugar(p.id)));
    if(def.pts.length>1) map.fitBounds(def.pts.map(p=>[p.lat,p.lon]),{padding:[30,30],maxZoom:15});
    else map.setView(def.pts[0]?[def.pts[0].lat,def.pts[0].lon]:def.centro,13);
  }
}
function montarMapa(){
  if(tab!=="viaje"||!$("mapaV")) return;
  const def=defMapa(),k=JSON.stringify(def);
  const listo=()=>{                            // vuestra posición se pone aparte, sin rehacer el mapa
    if(MAPA.yo){MAPA.yo.remove();MAPA.yo=null}
    const c=ciudadSel&&CIUDADES[ciudadSel];
    if(c&&POS&&distKm(POS.lat,POS.lon,c.lat,c.lon)<60)
      MAPA.yo=L.circleMarker([POS.lat,POS.lon],{radius:7,color:"#fff",weight:2,fillColor:"#1A73E8",fillOpacity:1}).addTo(MAPA.map).bindTooltip("Estáis aquí");
  };
  if(MAPA.el&&MAPA.k===k){                     // al repintar se reutiliza el mapa que ya estaba
    if($("mapaV")!==MAPA.el) $("mapaV").replaceWith(MAPA.el);
    MAPA.map.invalidateSize(); listo(); return;
  }
  cargarLeaflet().then(()=>{
    const ph=$("mapaV"); if(!ph||tab!=="viaje") return;
    if(MAPA.map) MAPA.map.remove();
    const el=document.createElement("div"); el.id="mapaV"; el.className="lmap on"; ph.replaceWith(el);
    const map=L.map(el,{scrollWheelZoom:false});
    MAPA={k,el,map,yo:null};
    dibujarMapa(map,def); listo();
  }).catch(()=>{
    const ph=$("mapaV"); if(ph&&ciudadSel) ph.innerHTML=`<p class="n">El mapa necesita conexión. Los sitios de abajo se abren en Mapas igualmente.</p>`;
  });
}

/* Teléfonos y correos escritos en el seguro → botones para llamar, escribir o abrir WhatsApp */
function contactos(t){
  let out="";const vistos=new Set();
  String(t||"").split("\n").forEach(linea=>{
    const wa=/whats/i.test(linea);
    (linea.match(/\+?\d[\d ().-]{7,}\d/g)||[]).forEach(x=>{
      const d=x.replace(/[^\d+]/g,""); if(d.replace(/\D/g,"").length<9||vistos.has(d)) return; vistos.add(d);
      out+=wa?`<a class="btn sm" href="https://wa.me/${d.replace(/\D/g,"")}" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i>${esc(x.trim())}</a>`
        :`<a class="btn sm" href="tel:${d}"><i class="fa-solid fa-phone"></i>${esc(x.trim())}</a>`;
    });
    (linea.match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/g)||[]).forEach(m=>{if(!vistos.has(m)){vistos.add(m);out+=`<a class="btn sm" href="mailto:${esc(m)}"><i class="fa-solid fa-envelope"></i>${esc(m)}</a>`}});
  });
  return out?`<div class="acc">${out}</div>`:"";
}

const CONSERVAR=["gI","gC","cvI","addT","diarioT","eN","eP","eR"];
function renderAll(forzar){
  const a=document.activeElement;
  if(!forzar&&a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&document.querySelector("main").contains(a)){dirty=true;return}
  dirty=false;
  const y=scrollY,selAntes=sel,vals={};
  CONSERVAR.forEach(id=>{if($(id)) vals[id]=$(id).value});      // lo escrito y aún sin guardar no se pierde
  rHoy();rViaje();rReservas();rGastos();rKit();montarMapa();
  CONSERVAR.forEach(id=>{if($(id)&&vals[id]!=null&&(id!=="diarioT"||sel===selAntes)) $(id).value=vals[id]});
  previaGasto();conversor();
  const n=pendientes(); $("pend").textContent=n?`${n} sin enviar`:""; $("pend").classList.toggle("on",!!n);
  scrollTo(0,y);
}

/* ---------- Calendario (.ics) ---------- */
function exportarICS(){
  const z=n=>String(n).padStart(2,"0");
  const utc=(iso,min)=>{const d=new Date(Date.UTC(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10),0,min-480));
    return `${d.getUTCFullYear()}${z(d.getUTCMonth()+1)}${z(d.getUTCDate())}T${z(d.getUTCHours())}${z(d.getUTCMinutes())}00Z`};
  const t=s=>String(s||"").replace(/\\/g,"\\\\").replace(/[,;]/g,m=>"\\"+m).replace(/\n/g,"\\n");
  let out=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Viaje a China//ES","CALSCALE:GREGORIAN","X-WR-CALNAME:Viaje a China"];
  DIAS.forEach(d=>itemsDia(d.iso).forEach(x=>{
    if(x.t==null) return;
    const fin=x.fin!=null&&x.fin>x.t?x.fin:x.t+60,p=x.lugar;
    out.push("BEGIN:VEVENT",`UID:${x.k.replace(/[^a-z0-9]/gi,"")}-${d.iso}@viaje-china`,`DTSTAMP:${utc(d.iso,0)}`,`DTSTART:${utc(d.iso,x.t)}`,`DTEND:${utc(d.iso,fin)}`,
      `SUMMARY:${t(x.titulo)}`);
    if(p) out.push(`LOCATION:${t([p.nombre,p.zh,p.dir].filter(Boolean).join(" "))}`);
    const desc=[x.notas,p&&p.reserva].filter(Boolean).join(" ");
    if(desc) out.push(`DESCRIPTION:${t(desc)}`);
    const al=x.tipo==="vuelo"?180:x.tipo==="tren"?90:(p&&p.reserva?30:0);
    if(al) out.push("BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${t(x.titulo)}`,`TRIGGER:-PT${al}M`,"END:VALARM");
    out.push("END:VEVENT");
  }));
  out.push("END:VCALENDAR");
  return out.join("\r\n");
}
async function compartirArchivo(file){
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}
  }catch(e){if(e&&e.name==="AbortError") return}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove();
}

/* ---------- Billetes guardados en el móvil (IndexedDB) ---------- */
function bd(){return new Promise((ok,ko)=>{const r=indexedDB.open("china-docs",1);r.onupgradeneeded=()=>r.result.createObjectStore("docs");r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)})}
async function bdOp(modo,fn){const db=await bd();return new Promise((ok,ko)=>{const tx=db.transaction("docs",modo),q=fn(tx.objectStore("docs"));tx.oncomplete=()=>ok(q&&q.result);tx.onerror=()=>ko(tx.error)})}
async function cargarDocs(){try{DOCS=new Set(await bdOp("readonly",s=>s.getAllKeys()));renderAll()}catch(e){}}
async function verDoc(k){
  try{
    const d=await bdOp("readonly",s=>s.get(k)); if(!d) return;
    const file=new File([d.blob],d.name||"billete",{type:d.type});
    if(/^image\//.test(d.type)){
      $("grande").innerHTML=`<button class="x" data-act="cerrar-grande">Cerrar</button><img src="${URL.createObjectURL(file)}" alt="Billete guardado">`;
      $("grande").classList.add("on");
    }else await compartirArchivo(file);
  }catch(e){aviso("No se ha podido abrir el billete.")}
}

const TABS=["hoy","viaje","reservas","gastos","kit"];
function mostrar(t){
  tab=t;
  document.querySelectorAll("nav.abajo [data-t],.acciones [data-t]").forEach(x=>x.classList.toggle("on",x.dataset.t===t));
  document.querySelectorAll("main>section").forEach(s=>s.classList.toggle("on",s.id==="s-"+t));
  rCabecera();montarMapa();
}
function ruta(){                              // la dirección manda: #viaje/pekin abre la guía de Pekín
  const [t,s]=decodeURIComponent(location.hash.slice(1)).split("/"),T=TABS.includes(t)?t:"hoy";
  if(T==="viaje"){const c=s&&CIUDADES[s]?s:null;if(c!==ciudadSel){ciudadSel=c;rViaje()}}
  if(T==="reservas"&&["hoteles","transporte","entradas"].includes(s)&&s!==resTab){resTab=s;rReservas()}
  mostrar(T);scrollTo(0,0);
}
function irA(t){if(location.hash.slice(1)===t) ruta(); else location.hash=t}
addEventListener("hashchange",()=>{cerrarHoja();ruta()});

document.addEventListener("click",async e=>{
  const q=s=>e.target.closest(s);
  let b;
  if(b=q("[data-t]")) return irA(b.dataset.t);
  if(b=q("[data-copiar]")){
    try{await navigator.clipboard.writeText(b.dataset.copiar);aviso("Copiado. Pégalo en DiDi o en Amap.")}catch(err){grande(b.dataset.copiar,"Mantén pulsado para copiar")}
    return;
  }
  if(b=q("[data-dia]")){sel=+b.dataset.dia;selManual=sel!==diaActual(ahoraCN());rHoy();return}
  if(b=q("[data-ir]")){sel=+b.dataset.ir;selManual=true;cerrarHoja();rHoy();irA("hoy");return}
  if(b=q("[data-ciudad]")){location.hash="viaje/"+b.dataset.ciudad;return}
  if(b=q("[data-clima]")) return climaHoja(b.dataset.clima);
  if(b=q("[data-lugar]")) return detalleLugar(b.dataset.lugar);
  if(b=q("[data-taxi-lugar]")){const l=DATA.lugares.find(x=>x.ID===b.dataset.taxiLugar);if(l) taxista(lugarDe(l.Nombre));return}
  if(b=q("[data-item]")) return detalleItem(b.dataset.item,b.dataset.di!=null?+b.dataset.di:null);
  if(b=q("[data-taxi-item]")){const x=itemsDia(DIAS[sel].iso).find(i=>i.k===b.dataset.taxiItem);if(x&&x.lugar) taxista(x.lugar);return}
  if(b=q("[data-taxi-hotel]")){const h=DATA.alojamiento.find(h=>h.Ciudad===b.dataset.hk);if(h) taxista(lugarHotel(h));return}
  if(b=q("[data-editar-agenda]")) return formAgenda(b.dataset.editarAgenda);
  if(b=q("[data-borrar-agenda]")){cerrarHoja();mutar({action:"remove",sheet:"Agenda",id:b.dataset.borrarAgenda});aviso("Plan borrado");return}
  if(b=q("[data-borrar-gasto]")){mutar({action:"remove",sheet:"Gastos",id:b.dataset.borrarGasto});aviso("Gasto borrado");return}
  if(b=q("[data-edit]")) return formFila(b.dataset.edit,+b.dataset.row);
  if(b=q("[data-res]")){resTab=b.dataset.res;history.replaceState(null,"","#reservas/"+resTab);rReservas();return}
  if(b=q("[data-mon]")){gMon=b.dataset.mon;$("gM").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));previaGasto();return}
  if(b=q("[data-cat]")){gCat=b.dataset.cat;$("gK").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));return}
  if(b=q("[data-pag]")){gPag=b.dataset.pag;LS.set("china-yo",gPag);$("gP").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));return}
  if(b=q("[data-frase]")) return grande(b.dataset.frase,b.dataset.es,b.dataset.py);
  if(b=q("[data-ver-doc]")) return verDoc(b.dataset.verDoc);
  if(b=q("[data-quitar-doc]")){await bdOp("readwrite",s=>s.delete(b.dataset.quitarDoc)).catch(()=>{});return cargarDocs()}
  if(b=q("[data-act]")){
    const a=b.dataset.act;
    if(a==="cerrar") cerrarHoja();
    if(a==="cerrar-grande") $("grande").classList.remove("on");
    if(a==="volver") location.hash="viaje";
    if(a==="nuevo-agenda"){if(b.dataset.di!=null&&+b.dataset.di!==sel){sel=+b.dataset.di;selManual=true;rHoy()}formAgenda(null)}
    if(a==="sync") sincronizar(true);
    if(a==="geo"){ubicar(true);renderAll()}
    if(a==="ics") compartirArchivo(new File([exportarICS()],"viaje-china.ics",{type:"text/calendar"}));
  }
});

function previaGasto(){
  const n=num($("gI").value);
  $("gE").textContent=n&&gMon!=="EUR"?`${dinero(n,gMon)} son ${eur(aEUR(n,gMon))}`:`1 EUR = ${FX.CNY.toFixed(2)} CNY = ${FX.HKD.toFixed(2)} HKD`;
}
document.addEventListener("input",e=>{
  if(e.target.id==="gI") previaGasto();
  if(e.target.id==="cvI") conversor();
});
function conversor(){
  const n=num($("cvI").value);
  $("cvO").innerHTML=n?`<b>${dinero(n,"CNY")}</b> son ${eur(aEUR(n,"CNY"))}<br><b>${dinero(n,"HKD")}</b> son ${eur(aEUR(n,"HKD"))}<br><b>${eur(n)}</b> son ${dinero(n*FX.CNY,"CNY")} o ${dinero(n*FX.HKD,"HKD")}`
    :"Escribe un importe en yuanes o dólares de Hong Kong.";
}
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="temaOsc"){
    const o=t.checked; LS.set("china-tema",o?"oscuro":"claro");
    if(o) document.documentElement.dataset.tema="oscuro"; else delete document.documentElement.dataset.tema;
    document.querySelector('meta[name="theme-color"]').content=o?"#0F172A":"#FFFFFF";
    MAPA.k=null; return;
  }
  if(t.matches("[data-ent]")){
    mutar({action:"upsert",sheet:"Ajustes",id:"ent:"+t.dataset.ent,values:{Valor:t.checked?"1":""}});return;
  }
  if(t.matches(".chk input")){
    const c=DATA.checklist.find(x=>x._row===+t.dataset.row); if(!c) return;
    mutar({action:"check",row:c._row,key:c._k,done:t.checked});
  }
  if(t.matches("[data-doc]")&&t.files[0]){
    const f=t.files[0];
    try{await bdOp("readwrite",s=>s.put({name:f.name,type:f.type,blob:f},t.dataset.doc));aviso("Billete guardado en este móvil");cargarDocs()}
    catch(err){aviso("No se ha podido guardar el billete.")}
  }
});
document.addEventListener("submit",e=>{
  const f=e.target.closest("[data-form]"); if(!f) return;
  e.preventDefault();
  const tipo=f.dataset.form,d=DIAS[sel];
  if(tipo==="diario"){
    mutar({action:"upsert",sheet:"Diario",id:"d"+d.iso.replace(/-/g,""),values:{Fecha:d.iso,Nota:$("diarioT").value.trim()}});aviso("Nota guardada");
  }else if(tipo==="agenda"){
    const id=f.dataset.id||"a"+Date.now().toString(36);
    mutar({action:"upsert",sheet:"Agenda",id,values:{Fecha:d.iso,Hora:$("aH").value,Fin:$("aF").value,"Qué":$("aQ").value.trim(),Lugar:$("aL").value.trim(),Tipo:$("aT").value,Notas:$("aN").value.trim()}});
    cerrarHoja();aviso("Agenda actualizada");
  }else if(tipo==="fila"){
    const sheet=f.dataset.sheet,r=DATA[sheet.toLowerCase()].find(x=>x._row===+f.dataset.row),values={};
    camposDe(sheet).forEach(([k,,t],i)=>{const v=$("f"+i).value.trim();values[k]=t==="num"?(v===""?"":num(v)??""):v});
    mutar({action:"update",sheet,row:r._row,key:r._k,values});cerrarHoja();aviso("Cambios guardados");
  }else if(tipo==="gasto"){
    const n=num($("gI").value); if(!n||n<=0){aviso("Escribe un importe");return}
    const now=ahoraCN(),dia=DIAS.find(x=>x.iso===now.iso),concepto=$("gC").value.trim();
    $("gI").value="";$("gC").value="";
    mutar({action:"upsert",sheet:"Gastos",id:"g"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
      values:{Fecha:now.iso,Ciudad:ciudadGPS()?CIUDADES[ciudadGPS()].n:dia?ciudad(dia.Ciudad).n:"Antes del viaje",Concepto:concepto,"Categoría":gCat,Importe:n,Moneda:gMon,EUR:Math.round(aEUR(n,gMon)*100)/100,"Pagó":gPag}});
    aviso("Gasto añadido");
  }else if(tipo==="tarea"){
    const t=$("addT").value.trim(); $("addT").value=""; if(t){mutar({action:"addTask",text:t});aviso("Tarea añadida")}
  }else if(tipo==="entrada"){
    const k=$("eC").value,nombre=$("eN").value.trim(); if(!nombre) return;
    mutar({action:"upsert",sheet:"Lugares",id:"l"+Date.now().toString(36),values:{Ciudad:CIUDADES[k].n,Nombre:nombre,Chino:"","Dirección":"",Horario:"",
      Precio:$("eP").value.trim(),Reserva:$("eR").value.trim()||"Comprar antes de ir",Notas:"",Lat:"",Lon:""}});
    $("eN").value=$("eP").value=$("eR").value="";aviso("Entrada añadida");
  }else if(tipo==="seguro"){
    mutar({action:"upsert",sheet:"Ajustes",id:"seguro",values:{Valor:$("segT").value.trim()}});aviso("Datos guardados");
  }else if(tipo==="personas"){
    mutar({action:"upsert",sheet:"Ajustes",id:"p1",values:{Valor:$("pe1").value.trim()}});
    mutar({action:"upsert",sheet:"Ajustes",id:"p2",values:{Valor:$("pe2").value.trim()}});aviso("Nombres guardados");
  }
});
