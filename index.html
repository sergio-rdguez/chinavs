<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B3261E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="China">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Viaje a China</title>
<style>
:root{
  --bg:#F3F4F2; --surface:#FFFFFF; --ink:#15181D; --muted:#636973; --line:#DFE2DD;
  --c:#B3261E; --ctext:var(--c); --ok:#1B7447; --warn:#96560A; --rojo:#B3261E;
  --f:"Avenir Next","Avenir",-apple-system,system-ui,"Segoe UI",sans-serif;
  --fd:"Avenir Next Condensed","Avenir Next","Arial Narrow",-apple-system,system-ui,sans-serif;
  --fn:"DIN Alternate","Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
  --fz:"Songti SC","STSong","Noto Serif CJK SC","PingFang SC",serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F1113; --surface:#1B1E22; --ink:#ECEEF0; --muted:#9AA1AA; --line:#2C3036;
    --ctext:color-mix(in srgb,var(--c) 48%,white); --ok:#63C897; --warn:#E5AE58; --rojo:#F08A80}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f);padding-bottom:calc(66px + var(--sb));overscroll-behavior-y:none}
main{max-width:560px;margin:0 auto}
main>section{display:none}
main>section.on{display:block}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ctext);outline-offset:2px}
.pad{padding:16px 16px 28px}
.n{display:block;color:var(--muted);font-size:13.5px;line-height:1.4;margin-top:3px}
p.n{margin-top:10px}
.zh{font-family:var(--fz);color:var(--ctext)}
h2{font:600 22px/1.15 var(--fd);margin:28px 0 10px}
h2 small{font:400 14px var(--f);color:var(--muted);margin-left:6px}

/* Cabecera del día: el color y los caracteres de la ciudad */
.hero{position:relative;overflow:hidden;background:var(--c);color:#fff;padding:calc(var(--st) + 20px) 20px 18px;min-height:calc(var(--st) + 196px)}
.hz{position:absolute;right:14px;top:calc(var(--st) + 14px);writing-mode:vertical-rl;white-space:nowrap;font:900 84px/1 var(--fz);opacity:.26;pointer-events:none;user-select:none}
.hz.l3{font-size:57px}
.hd{font-size:14px;font-weight:600;opacity:.95}
.hd span{margin-left:8px;background:rgba(255,255,255,.22);padding:2px 9px;border-radius:20px;font-weight:500}
.hero h1{font:600 54px/1 var(--fd);letter-spacing:-.01em;margin:8px 0 6px}
.hf::first-letter{text-transform:uppercase}
.hm{display:flex;flex-wrap:wrap;gap:6px 16px;font:15px var(--fn);margin-top:16px;position:relative}

.cab{padding:calc(var(--st) + 20px) 20px 4px}
.cab h1{font:600 36px/1.05 var(--fd)}
.cab p{color:var(--muted);margin-top:6px;font-size:15px}
.cab .seg{margin-top:14px}

/* Tira de días */
.tira{display:flex;gap:2px;overflow-x:auto;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none}
.tira::-webkit-scrollbar{display:none}
.tira button{flex:0 0 44px;height:58px;border:0;background:none;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.tira span{font-size:11px;color:var(--muted)}
.tira b{font:400 18px/1.1 var(--fn)}
.tira i{width:5px;height:5px;border-radius:50%;background:var(--dc)}
.tira .hoy b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.tira .on{background:var(--ink);color:var(--bg)}
.tira .on span{color:inherit;opacity:.7}

/* Ahora y después */
.ahora{background:var(--surface);border-left:4px solid var(--c);border-radius:4px 12px 12px 4px;padding:12px 14px;display:grid;gap:10px;margin-bottom:18px}
.ahora small{display:block;color:var(--muted);font-size:13px}
.ahora b{display:block;font-size:17px;line-height:1.25}
.ahora em{font-style:normal;color:var(--muted);font-size:14px}
.ahora .tr{border-top:1px solid var(--line);padding-top:10px}

/* Línea de tiempo */
.it{display:grid;grid-template-columns:50px 30px 1fr;width:100%;text-align:left;background:none;border:0;padding:0;min-height:56px}
.it .h{font:18px/1.2 var(--fn);padding-top:3px}
.it .h small{display:block;font-size:12.5px;color:var(--muted)}
.it .r{position:relative;display:flex;justify-content:center}
.it .r::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
.it:first-child .r::before{top:10px}
.it:last-of-type .r::before{bottom:auto;height:14px}
.it .r i{position:relative;width:26px;height:26px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line);font-size:13px;font-style:normal;display:grid;place-items:center}
.it .b{padding:2px 0 18px 10px;min-width:0}
.it .b b{display:block;font-size:16px;line-height:1.3;font-weight:600}
.it .b .zh{display:block;font-size:15px;margin-top:1px}
.it.cur .r i{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.it.cur .b b{color:var(--ctext)}
.it.pas{opacity:.5}
.it.t-vuelo .r i,.it.t-tren .r i{background:var(--c);border-color:var(--c)}
.it.t-vuelo .b b,.it.t-tren .b b{font-weight:700}
.now{display:grid;grid-template-columns:50px 1fr;align-items:center;margin:-6px 0 8px}
.now span{font:700 13px var(--fn);color:var(--ctext)}
.now i{height:2px;background:var(--c);border-radius:2px}
.vacio{color:var(--muted);padding:6px 0 14px}
.it .km{color:var(--ctext)}
.pad>.enl{display:block;margin:8px auto 0}
.alerta .enl{display:block;padding:4px 0 0}

.fila{background:var(--surface);border-radius:12px;padding:12px 14px;display:flex;gap:12px;justify-content:space-between;align-items:center}
.fila.col{display:block}
.fila.col p+p{margin-top:6px}
.fila .zh{display:block;font-size:15px}
.acc{display:flex;flex-wrap:wrap;gap:8px}
.fila .acc{flex:none;flex-direction:column}
.diario{display:grid;gap:8px;justify-items:start}

.btn{font:600 15px var(--f);min-height:44px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;text-decoration:none;text-align:center}
.btn.pri{background:var(--c);border-color:transparent;color:#fff}
.btn.sm{min-height:36px;padding:5px 12px;font-size:14px}
label.btn{margin:0;color:var(--ink);cursor:pointer}
.btn.linea{width:100%;background:none;border-style:dashed;color:var(--muted)}
.btn.peligro{color:var(--rojo)}
.btn.ancho{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.enl{background:none;border:0;padding:6px 0;color:var(--ctext);font-size:14px;text-decoration:underline;text-underline-offset:2px}

input[type=text],input[type=time],textarea,select{font:16px var(--f);width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);appearance:none;-webkit-appearance:none}
textarea{resize:vertical;line-height:1.4}
label{display:block;font-size:13.5px;color:var(--muted);margin:12px 0 4px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;align-items:end}
.dos>.btn{grid-column:1/-1;margin-top:10px;justify-self:start}
form>.btn{margin-top:10px}

/* Hoja inferior */
dialog{margin:auto auto 0;width:100%;max-width:560px;max-height:88dvh;border:0;border-radius:18px 18px 0 0;padding:0;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
#dlgB{padding:22px 18px calc(22px + var(--sb));overflow-y:auto;max-height:88dvh}
#dlgB h3{font:600 26px/1.1 var(--fd)}
.dk{color:var(--muted);font-size:14px;margin-bottom:4px}
.dk::first-letter{text-transform:uppercase}
.dh{font:20px var(--fn);margin:6px 0 10px}
.lugar{margin-top:14px;padding:14px;background:var(--bg);border-radius:12px}
.zhG{font:700 34px/1.15 var(--fz);color:var(--ctext);margin-bottom:6px}
.lugar dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:10px 0 0;font-size:15px}
.lugar dt{color:var(--muted);font-size:13.5px;padding-top:1px}
.lugar dd{margin:0}

/* Pantalla grande para enseñar a alguien */
#grande{position:fixed;inset:0;z-index:50;background:#fff;color:#000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--st) + 64px) 22px calc(var(--sb) + 30px);text-align:center;overflow:auto}
#grande.on{display:flex}
#grande .x{position:absolute;top:calc(var(--st) + 12px);right:14px;border:1px solid #bbb;background:#fff;color:#000;border-radius:10px;padding:9px 14px;font-weight:600}
.gz{font:700 clamp(42px,14vw,88px)/1.25 var(--fz);white-space:pre-line}
.gz.lg{font-size:clamp(30px,9.5vw,58px)}
.gp{font-size:20px;color:#444;margin-top:14px}
.gs{font-size:16px;color:#555;margin-top:22px;max-width:30em}
#grande img{max-width:100%;max-height:100%;object-fit:contain}

/* Viaje */
.mapa{background:var(--surface);border-radius:14px;padding:8px 8px 12px}
.mapa svg{display:block;width:100%;height:auto;max-height:400px}
.mapa path{fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round}
.mapa .vu{stroke-dasharray:2 6}
.mapa .cn{font:600 13px var(--f);fill:var(--ink)}
.mapa .cz{font:12px var(--fz);fill:var(--muted)}
.mapa .nn{font:700 9px var(--f);fill:#fff;text-anchor:middle}
.ley{display:flex;gap:18px;justify-content:center;font-size:13px;color:var(--muted)}
.ley span{display:flex;align-items:center;gap:6px}
.ley i{width:22px;border-top:2px solid var(--muted)}
.ley .l2{border-top-style:dotted;border-top-width:3px}
.lista{margin:0;padding-left:20px}
.lista li{margin:5px 0}
.prog{margin-top:16px}
.prog>div:first-child{display:flex;justify-content:space-between;font-size:15px;margin-bottom:6px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:6px}
.cd{font:600 21px var(--fd);margin:24px 0 4px}
.cd span{font:700 19px var(--fz);color:color-mix(in srgb,var(--dc) 70%,var(--ink));margin-right:8px}
.dia{display:grid;grid-template-columns:46px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.dd{background:none;border:0;padding:0;text-align:center;align-self:start}
.dd b{display:block;font:400 24px/1 var(--fn);color:color-mix(in srgb,var(--dc) 70%,var(--ink))}
.dd span{font-size:12px;color:var(--muted)}
.dia.hoy .dd b{text-decoration:underline;text-underline-offset:4px}
.dia.pas{opacity:.55}

/* Reservas */
.res{background:var(--surface);border-radius:14px;border-top:4px solid var(--dc);padding:14px 16px;margin-bottom:12px}
.res header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.res h3{font:600 22px/1.15 var(--fd)}
.res h3 .zh{font-size:17px;font-weight:400;color:var(--muted);margin-left:4px}
.res header p{color:var(--muted);font-size:14.5px;margin-top:2px}
.res header p::first-letter{text-transform:uppercase}
.est{flex:none;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:20px}
.est.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.est.pend{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.rf{margin-top:10px;font-size:15px}
.rp{font:19px var(--fn);margin-top:4px}
.rp span{font:13.5px var(--f);color:var(--muted);margin-left:6px}
.res p.zh{font-size:17px;margin-top:8px}
.res .acc{margin-top:12px}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 10px;font-weight:600;font-size:14px;color:var(--muted);min-height:36px}
.seg .on{background:var(--surface);color:var(--ink)}
.seg.mini{flex:none}

/* Gastos */
.gf{background:var(--surface);border-radius:14px;padding:14px;display:grid;gap:12px}
.imp{display:flex;gap:10px;align-items:center}
#gI{font:42px/1.1 var(--fn);border:0;background:none;padding:0;min-width:0;flex:1}
#gI:focus{outline:0}
.conv{color:var(--muted);font-size:13.5px;margin-top:-6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:none;border-radius:20px;padding:6px 12px;font-size:14px;min-height:36px}
.chips .on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.bl{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:14.5px;margin:7px 0}
.bl b{font:15px var(--fn)}
.gd{display:flex;justify-content:space-between;font:600 14px var(--f);color:var(--muted);margin:18px 0 2px}
.gd span:first-child::first-letter{text-transform:uppercase}
.g{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.g b{font-weight:600;font-size:15px}
.gi{text-align:right}
.gi b{font:16px var(--fn)}

/* Kit */
.chk label{display:flex;gap:12px;align-items:flex-start;margin:0;padding:11px 0;border-bottom:1px solid var(--line);font-size:15.5px;color:var(--ink)}
.chk input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--c)}
.chk input:checked+span{color:var(--muted);text-decoration:line-through}
.add{display:flex;gap:8px;margin-top:12px}
.add .btn{margin:0;flex:none}
.cv{background:var(--surface);border-radius:12px;padding:12px 14px}
.cv input{font:22px var(--fn)}
.cv .n{font-size:15px;margin-top:10px;line-height:1.6}
.cv .n b{color:var(--ink);font-weight:600}
.fg{font:600 14px var(--f);color:var(--muted);margin:16px 0 6px}
.fr{display:grid;gap:6px}
.fr button{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;background:var(--surface);border:0;border-radius:10px;padding:10px 12px;align-items:baseline}
.fr span{font-size:15px}
.fr b{font:600 19px var(--fz);color:var(--ctext);text-align:right}
.fr i{grid-column:1/-1;font-style:normal;font-size:13px;color:var(--muted)}
.em{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.em a{background:var(--surface);border-radius:12px;padding:12px;text-decoration:none;color:var(--muted);font-size:13.5px}
.em b{display:block;font:26px/1.1 var(--fn);color:var(--ctext)}
.alerta{background:color-mix(in srgb,var(--warn) 13%,transparent);border-left:3px solid var(--warn);border-radius:4px 10px 10px 4px;padding:10px 12px;font-size:14.5px;margin-bottom:14px}

nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--sb)}
nav button{flex:1;max-width:112px;background:none;border:0;padding:8px 2px 7px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav .on{color:var(--ctext);font-weight:600}
#pend{position:fixed;top:calc(var(--st) + 8px);right:10px;z-index:9;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 10px;border-radius:20px;display:none}
#pend.on{display:block}
#aviso{position:fixed;left:50%;bottom:calc(80px + var(--sb));transform:translateX(-50%);z-index:60;max-width:88vw;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14.5px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#aviso.on{opacity:1}
@media (prefers-reduced-motion:reduce){#aviso{transition:none}}

/* Guía de cada ciudad */
.cw{--ctext:var(--c)}
@media (prefers-color-scheme:dark){.cw{--ctext:color-mix(in srgb,var(--c) 48%,white)}}
.volver{position:relative;background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:20px;padding:5px 12px 5px 9px;font-size:14px;font-weight:600;margin-bottom:12px}
.hero .hm button{background:none;border:0;color:#fff;padding:0;font:inherit;text-decoration:underline;text-decoration-color:rgba(255,255,255,.55);text-underline-offset:3px}
.cds{display:grid;gap:8px}
.cc{display:grid;grid-template-columns:auto 1fr auto;gap:2px 14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:0;border-left:4px solid var(--dc);border-radius:4px 14px 14px 4px;padding:12px 14px}
.cc .z{grid-column:1;grid-row:1/3;font:700 24px/1 var(--fz);color:color-mix(in srgb,var(--dc) 75%,var(--ink));min-width:2.2em}
.cc b{grid-column:2;font:600 19px/1.15 var(--fd)}
.cc small{grid-column:2;color:var(--muted);font-size:13.5px}
.cc .w{grid-column:3;grid-row:1/3;font:15px var(--fn);color:var(--muted);text-align:right}
.cc.hoy{box-shadow:inset 0 0 0 2px var(--dc)}
.pv{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0;border:0;background:none;width:100%;text-align:center}
.pv::-webkit-scrollbar{display:none}
.pv>span{flex:0 0 62px;background:var(--surface);border-radius:12px;padding:8px 4px;font-size:12.5px;color:var(--muted)}
.pv i{display:block;font-style:normal;font-size:20px;margin:2px 0}
.pv b{display:block;font:17px var(--fn);color:var(--ink)}
.pv .vi{box-shadow:inset 0 0 0 2px var(--c)}
.fila.clb{width:100%;border:0;text-align:left;font-size:15px}
.pr{display:grid;grid-template-columns:1fr auto 74px 44px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.pr.vi>b{color:var(--ctext)}
.pr b::first-letter{text-transform:uppercase}
.pr .t{font:16px var(--fn);text-align:right}
.pr .ll{color:var(--muted);font-size:13px;text-align:right}
.pr.cab{color:var(--muted);font-size:12.5px;border-top:0;padding-bottom:2px}
.ahw{display:flex;align-items:center;gap:14px;margin:12px 0 16px}
.ahw>span{font-size:40px}
.ahw b{font:600 46px/1 var(--fn)}
.lgs{display:grid;gap:6px}
.lgs button{display:grid;grid-template-columns:24px 1fr auto;gap:2px 10px;align-items:center;text-align:left;background:var(--surface);border:0;border-radius:10px;padding:10px 12px;width:100%}
.lgs .nn{grid-row:1/3;width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;font:700 12px/24px var(--f);text-align:center}
.lgs b{font-weight:600;font-size:15.5px}
.lgs .zh{font-size:15px;text-align:right}
.lgs small{grid-column:2/-1;color:var(--muted);font-size:13px}
.tips{margin:0;padding-left:20px;font-size:15px}
.tips li{margin:6px 0}

/* Mapas (Leaflet) */
.lmap{position:relative;z-index:0;border-radius:14px;overflow:hidden;background:var(--surface)}
.lmap.on{height:340px}
.lmap>.n{padding:40px 16px;text-align:center;margin:0}
.lmap .leaflet-container,.lmap.leaflet-container{font:13px var(--f)}
.pin span{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;color:#fff;font:700 12px/1 var(--f);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
@media (prefers-color-scheme:dark){.lmap .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}}
.leaflet-tooltip.tt{font:600 12.5px var(--f);padding:2px 8px;border-radius:12px}

/* Entradas y documentos */
.ent label{align-items:center}
.ent span{flex:1;min-width:0}
.ent span b{font-weight:600}
.ent .zh{font-size:14.5px;margin-left:4px}
.ent small{display:block;margin-top:2px}

function distKm(a,b,c,d){
  const r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;
  return 12742*Math.asin(Math.sqrt(x));
}

function ciudadGPS(){                         // la ciudad del viaje más cercana, si estáis a menos de 120 km
  if(!POS) return null;
  let m=null;
  for(const k in CIUDADES){const c=CIUDADES[k],d=distKm(POS.lat,POS.lon,c.lat,c.lon);if(d<120&&(!m||d<m.d)) m={k,d}}
  return m&&m.k;
}
function nuevaPos(lat,lon){
  const mov=POS?distKm(POS.lat,POS.lon,lat,lon):9;
  POS={lat,lon};
  if(mov>0.05) repintarHoy();                 // solo si os habéis movido más de 50 m
}
function ubicar(pedida){
  const f=PARAMS.get("pos");                  // ?pos=39.9163,116.3972 para previsualizar
  if(f){const [a,b]=f.split(",").map(Number);return nuevaPos(a,b)}
  if(!navigator.geolocation){if(pedida) aviso("Este navegador no da acceso a la ubicación.");return}
  if(geoVigia!=null) return;
  geoVigia=navigator.geolocation.watchPosition(p=>{LS.set("china-geo","1");nuevaPos(p.coords.latitude,p.coords.longitude)},
    e=>{
      navigator.geolocation.clearWatch(geoVigia);geoVigia=null;
      if(e.code===1){LS.set("china-geo","");if(pedida) aviso("Permiso de ubicación denegado. Se cambia en Ajustes del iPhone.")}
      else if(pedida) aviso("No se ha podido obtener la ubicación.");
      renderAll();
    },{enableHighAccuracy:true,maximumAge:60000,timeout:20000});
}

const fecha=(iso,o={day:"numeric",month:"short"})=>iso?D(iso).toLocaleDateString("es-ES",o):"";
const diasEntre=(a,b)=>Math.round((D(b)-D(a))/864e5);
function horaMin(v){const m=String(v??"").match(/^\s*(\d{1,2})[:.h](\d{2})/);return m?+m[1]*60+ +m[2]:null}
const fmtMin=m=>m==null?"":`${String(Math.floor(m/60)%24).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
function durTxt(min){
  if(min<1) return "ahora";
  if(min<60) return `${min} min`;
  const h=Math.floor(min/60),m=min%60;
  if(h<24) return m?`${h} h ${m} min`:`${h} h`;
  const d=Math.floor(h/24); return d===1?"1 día":`${d} días`;
}
function claveCiudad(c){const k=norm(c);return ALIAS_CIUDAD[k]||k}
function ciudad(c){return CIUDADES[claveCiudad(c)]||{n:limpio(c)||"Viaje",zh:"",c:"#3D4652",lat:null,lon:null,mon:"CNY"}}
const v2=()=>((SERVER&&SERVER.version)||1)>=2;
const partes=s=>limpio(s).split(/,\s*(?![^()]*\))/).map(x=>x.trim()).filter(Boolean);
const sinHotel=h=>!limpio(h.Hotel)||/por reservar/i.test(h.Hotel);
const noches=h=>{const a=toISO(h["Check-in"]),b=toISO(h["Check-out"]);return a&&b?diasEntre(a,b):(num(h.Noches)||0)};
const ajuste=(k,def)=>{const a=DATA.ajustes.find(x=>x.ID===k);return a&&limpio(a.Valor)?a.Valor:def};
const personas=()=>[ajuste("p1","Sergio"),ajuste("p2","Pareja")];

/* Hora de China (Pekín y Hong Kong comparten huso, UTC+8, sin cambio de hora) */
function ahoraCN(){
  if(FAKE){const [d,t="12:00"]=FAKE.split("T");const [h,m]=t.split(":");return {iso:d,min:+h*60+ +m}}
  const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
  const g=t=>p.find(x=>x.type===t).value;
  return {iso:`${g("year")}-${g("month")}-${g("day")}`,min:+g("hour")*60+ +g("minute")};
}
function horaMadrid(now){
  if(FAKE) return fmtMin((now.min+17*60)%1440);          // en noviembre, 7 h menos
  return new Intl.DateTimeFormat("es-ES",{timeZone:"Europe/Madrid",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(new Date());
}

/* ---------- Estado: última copia de la hoja + cambios aún sin enviar ---------- */
const TABLA={Agenda:"agenda",Lugares:"lugares",Gastos:"gastos",Diario:"diario",Ajustes:"ajustes"};
const SOLO_V2=new Set(["upsert","remove","seed"]);

function aplicar(d,op){
  if(op.action==="update"){
    const r=(d[op.sheet.toLowerCase()]||[]).find(x=>x._row===op.row);
    if(r) Object.assign(r,op.values);
  }else if(op.action==="check"){
    const r=d.checklist.find(x=>x._row===op.row); if(r) r.Hecho=op.done;
  }else if(op.action==="addTask"){
    if(!d.checklist.some(c=>c.Tarea===op.text)) d.checklist.push({Tarea:op.text,Hecho:false});
  }else if(op.action==="upsert"){
    const L=d[TABLA[op.sheet]],r=L.find(x=>x.ID===op.id);
    if(r) Object.assign(r,op.values); else L.push({ID:op.id,...op.values});
  }else if(op.action==="remove"){
    const k=TABLA[op.sheet]; d[k]=d[k].filter(x=>x.ID!==op.id);
  }
}
function rebuild(){
  const d=clon(SERVER||INICIAL),nuevo=(d.version||1)>=2;
  for(const k of ["itinerario","alojamiento","transporte","checklist","gastos","diario","ajustes"]) d[k]=d[k]||[];
  d.agenda=nuevo&&d.agenda&&d.agenda.length?d.agenda:clon(SEED_AGENDA);
  d.lugares=nuevo&&d.lugares&&d.lugares.length?d.lugares:clon(SEED_LUGARES);
  QUEUE.forEach(op=>aplicar(d,op));
  DATA=d;
  const ini=toISO(d.alojamiento[0]&&d.alojamiento[0]["Check-in"])||"2026-10-27";
  DIAS=d.itinerario.map((x,i)=>{
    let iso=toISO(x.Fecha);
    if(!iso){const t=D(ini);t.setDate(t.getDate()+i);iso=isoDe(t)}
    return {...x,iso,ck:claveCiudad(x.Ciudad)};
  });
}
const guardaCola=()=>LS.set("china-queue",QUEUE);
function recibe(j){
  SERVER=j; LS.set("china-server",j); LS.set("china-ts",String(Date.now()));
  if((j.version||1)>=2){          // primera vez con las pestañas nuevas vacías: se rellenan con la propuesta
    for(const [hoja,rows] of [["Lugares",SEED_LUGARES],["Agenda",SEED_AGENDA]]){
      if(!(j[TABLA[hoja]]||[]).length&&!QUEUE.some(o=>o.action==="seed"&&o.sheet===hoja))
        QUEUE.unshift({action:"seed",sheet:hoja,rows});
    }
    guardaCola();
  }
}
function mutar(op){
  QUEUE.push(op); guardaCola(); rebuild(); renderAll(true); enviar();
}
async function enviar(){
  if(flushing||!QUEUE.length) return;
  flushing=true;
  try{
    let i=0;
    while(i<QUEUE.length){
      const op=QUEUE[i];
      if(SOLO_V2.has(op.action)&&!v2()){i++;continue}       // espera a que se actualice el script
      let j;
      try{
        const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(op)});
        j=await r.json();
      }catch(e){syncEstado="sin";break}
      QUEUE.splice(i,1); guardaCola();
      if(j&&j.error) aviso("Un cambio no se ha guardado: "+j.error);
      else if(j&&j.itinerario){recibe(j);syncEstado=""}
    }
  }finally{flushing=false; rebuild(); renderAll()}
}
async function sincronizar(manual){
  syncEstado="…"; if(manual) rKit();
  try{
    const r=await fetch(API+"?t="+Date.now());
    const j=await r.json();
    if(!j||j.error||!j.itinerario) throw new Error(j&&j.error||"Respuesta no válida");
    recibe(j); syncEstado=""; rebuild(); renderAll();
    if(manual) aviso("Datos actualizados");
  }catch(e){
    syncEstado="sin"; renderAll();
    if(manual) aviso("Sin conexión con la hoja. Se muestra la última copia.");
  }
  enviar();
}
const pendientes=()=>QUEUE.filter(o=>o.action!=="seed").length;

/* ---------- Consultas sobre el viaje ---------- */
const hotelNoche=iso=>DATA.alojamiento.find(h=>{const a=toISO(h["Check-in"]),b=toISO(h["Check-out"]);return a&&b&&a<=iso&&iso<b});
const hotelSalida=iso=>DATA.alojamiento.find(h=>toISO(h["Check-out"])===iso);
function lugarHotel(h){
  const c=ciudad(h.Ciudad);
  return {nombre:sinHotel(h)?"Hotel en "+h.Ciudad:h.Hotel,dir:limpio(h["Dirección (chino)"]),hotel:true,sin:sinHotel(h),
    lat:c.lat,lon:c.lon,czh:c.zh,cn:c.mon==="CNY",loc:limpio(h.Localizador)};
}
function lugarDe(nombre,iso){
  const n=limpio(nombre); if(!n) return null;
  if(/^hotel(\s*\(salida\))?$/i.test(n)){
    const h=/salida/i.test(n)?hotelSalida(iso):hotelNoche(iso);
    return h?lugarHotel(h):null;
  }
  const k=norm(n),l=DATA.lugares.find(x=>norm(x.Nombre)===k);
  if(!l) return {nombre:n};
  const c=ciudad(l.Ciudad);
  return {id:l.ID,nombre:l.Nombre,czh:c.zh,cn:c.mon==="CNY",zh:limpio(l.Chino),dir:limpio(l["Dirección"]),horario:limpio(l.Horario),precio:limpio(l.Precio),
    reserva:limpio(l.Reserva),notas:limpio(l.Notas),lat:parseFloat(l.Lat)||null,lon:parseFloat(l.Lon)||null};
}
function urlMapas(p){
  const q=p.zh||p.dir||(p.hotel?`${p.nombre} ${p.czh||""}`:p.nombre);
  return "https://maps.apple.com/?q="+encodeURIComponent(q.trim())+(p.lat?`&sll=${p.lat},${p.lon}`:"");
}
function urlAmap(p){                          // Amap (高德) es el mapa que mejor funciona en China continental
  const q=p.zh||p.dir||(p.hotel&&!p.sin?p.nombre:"");
  if(!p.cn||!q) return null;
  return "https://uri.amap.com/search?keyword="+encodeURIComponent(q.trim())+(p.czh?"&city="+encodeURIComponent(p.czh):"")+"&callnative=1";
}
function primeraVisita(){                     // nombre del lugar → primera vez que sale en la agenda
  const o={};
  [...DATA.agenda].sort((a,b)=>String(toISO(a.Fecha)).localeCompare(String(toISO(b.Fecha)))||(horaMin(a.Hora)??0)-(horaMin(b.Hora)??0))
    .forEach((a,i)=>{const k=norm(a.Lugar);if(k&&!o[k]) o[k]={i,iso:toISO(a.Fecha)}});
  return o;
}
function lugaresCiudad(ck){                   // en el orden en que se visitan; los que no están en la agenda, al final
  const o=primeraVisita();
  return DATA.lugares.filter(l=>claveCiudad(l.Ciudad)===ck).map(l=>({l,o:o[norm(l.Nombre)]}))
    .sort((a,b)=>(a.o?a.o.i:1e9)-(b.o?b.o.i:1e9)).map((x,i)=>({...x,n:i+1}));
}
const esEntrada=l=>!!limpio(l.Reserva)||/\d/.test(limpio(l.Precio));
function entradas(){
  const o=primeraVisita(),orden=Object.keys(CIUDADES);
  return DATA.lugares.filter(esEntrada).map(l=>({l,o:o[norm(l.Nombre)],ok:ajuste("ent:"+l.ID,"")==="1"}))
    .sort((a,b)=>(a.o?a.o.i:1e9)-(b.o?b.o.i:1e9)||orden.indexOf(claveCiudad(a.l.Ciudad))-orden.indexOf(claveCiudad(b.l.Ciudad)));
}
function itemsDia(iso){
  const out=[];
  DATA.agenda.forEach(a=>{
    if(toISO(a.Fecha)!==iso) return;
    out.push({k:"ag:"+a.ID,t:horaMin(a.Hora),fin:horaMin(a.Fin),titulo:limpio(a["Qué"])||"Sin título",tipo:norm(a.Tipo)||"visita",
      notas:limpio(a.Notas),lugar:lugarDe(a.Lugar,iso),a});
  });
  DATA.transporte.forEach((t,i)=>{
    if(toISO(t.Fecha)!==iso) return;
    const s=horaMin(t.Salida),l=horaMin(t.Llegada),soloLlegada=s==null&&l!=null;
    const extra=[!soloLlegada&&s==null&&limpio(t.Salida)?"Salida: "+t.Salida:"",s==null&&l==null&&!limpio(t.Salida)?"Hora por confirmar":"",
      limpio(t["Nº vuelo/tren"]),limpio(t.Localizador)?"Localizador "+t.Localizador:"",limpio(t.Estado)==="Pendiente"?"Por reservar":""].filter(Boolean).join(". ");
    out.push({k:"tr:"+i,t:soloLlegada?l:s,fin:!soloLlegada&&l!=null&&l>s?l:null,
      titulo:(soloLlegada?"Llegada: ":"")+`${t.Tipo} ${t.Origen} → ${t.Destino}`,tipo:/vuelo/i.test(t.Tipo)?"vuelo":"tren",notas:extra,tr:t});
  });
  return out.sort((a,b)=>(a.t??-1)-(b.t??-1));
}
function proximoTrayecto(now){
  let mejor=null;
  DATA.transporte.forEach(t=>{
    const iso=toISO(t.Fecha),s=horaMin(t.Salida); if(!iso) return;
    if(iso<now.iso||(iso===now.iso&&(s??1440)<=now.min)) return;
    const falta=diasEntre(now.iso,iso)*1440+(s??720)-now.min;
    if(!mejor||falta<mejor.falta) mejor={t,iso,s,falta};
  });
  return mejor;
}
function diaActual(now){return DIAS.findIndex(d=>d.iso===now.iso)}

/* ---------- Clima (Open-Meteo, hasta 16 días vista) ---------- */
const climaOcupado={};
async function pedirClima(ck){
  const c=CIUDADES[ck]; if(!c||climaOcupado[ck]) return;
  const w=WX[ck]; if(w&&Date.now()-w.ts<3*3600e3) return;
  climaOcupado[ck]=1;
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FShanghai&forecast_days=16`);
    const j=await r.json();
    if(j.daily){WX[ck]={ts:Date.now(),d:j.daily,cur:j.current||null};LS.set("china-wx",WX);renderAll()}
  }catch(e){}finally{climaOcupado[ck]=0}
}
function climaDia(ck,iso){
  const w=WX[ck]; if(!w||!w.d||!w.d.time) return null;
  const i=w.d.time.indexOf(iso); if(i<0) return null;
  const [ico,txt]=wxInfo(w.d.weather_code[i]);
  return {ico,txt,max:Math.round(w.d.temperature_2m_max[i]),min:Math.round(w.d.temperature_2m_min[i]),pp:w.d.precipitation_probability_max[i]};
}
function wxInfo(code){
  return code===0?["☀️","Despejado"]:code<3?["🌤️","Poco nuboso"]:code===3?["☁️","Nublado"]:code<50?["🌫️","Niebla"]:
    code<58?["🌦️","Llovizna"]:code<68?["🌧️","Lluvia"]:code<78?["❄️","Nieve"]:code<83?["🌧️","Chubascos"]:code<87?["❄️","Nieve"]:["⛈️","Tormenta"];
}
function climaHoja(ck){
  const c=CIUDADES[ck],w=WX[ck],g=GUIA[ck]||{},mias=new Set(DIAS.filter(d=>d.ck===ck).map(d=>d.iso));
  let h=`<div class="cw" style="--c:${c.c}"><p class="dk">Previsión del tiempo</p><h3>${esc(c.n)} <span class="zh">${c.zh}</span></h3>`;
  if(w&&w.cur&&w.cur.weather_code!=null){
    const [ico,txt]=wxInfo(w.cur.weather_code);
    h+=`<div class="ahw"><span>${ico}</span><b>${Math.round(w.cur.temperature_2m)}°</b><p class="n">${txt}. Sensación de ${Math.round(w.cur.apparent_temperature)}°<br>
      Humedad ${Math.round(w.cur.relative_humidity_2m)}%, viento ${Math.round(w.cur.wind_speed_10m)} km/h</p></div>`;
  }
  if(w&&w.d&&w.d.time){
    h+=`<div class="pr cab"><span>Día</span><span></span><span class="t">Máx / mín</span><span class="ll">Lluvia</span></div>`+w.d.time.map(iso=>{const x=climaDia(ck,iso);
      return `<div class="pr ${mias.has(iso)?"vi":""}"><b>${fecha(iso,{weekday:"short",day:"numeric",month:"short"})}</b><span>${x.ico}</span><span class="t">${x.max}° / ${x.min}°</span><span class="ll">${x.pp!=null?x.pp+"%":""}</span></div>`}).join("")
      +`<p class="n">${mias.size?"En color, los días que estaréis aquí. ":""}Open-Meteo, consultado hace ${durTxt(Math.round((Date.now()-w.ts)/6e4))}.</p>`;
  }else h+=`<p class="n">Cargando la previsión… Necesita conexión.</p>`;
  if(g.clima) h+=`<p class="n">Clima habitual a principios de noviembre: máximas de unos ${g.clima[0]}° y mínimas de ${g.clima[1]}°.</p>`;
  hoja(h+`<div class="btns"><button class="btn" data-act="cerrar">Cerrar</button></div></div>`);
  $("dlgB").dataset.clima=ck;
  if(!FAKE) pedirClima(ck).then(()=>{if($("dlg").open&&$("dlgB").dataset.clima===ck&&WX[ck]!==w) climaHoja(ck)});
}

/* ---------- HOY ---------- */
const ICO={visita:"📍",comida:"🍜",traslado:"🚕",hotel:"🛏️",libre:"☕",vuelo:"✈️",tren:"🚄"};
function rHoy(){
  const now=ahoraCN(),hoyI=diaActual(now);
  if(sel==null||(!selManual&&hoyI>=0)) sel=hoyI>=0?hoyI:(now.iso>DIAS[DIAS.length-1].iso?DIAS.length-1:0);
  sel=Math.min(sel,DIAS.length-1);
  const d=DIAS[sel],c=ciudad(d.Ciudad),esHoy=d.iso===now.iso,items=itemsDia(d.iso);
  document.documentElement.style.setProperty("--c",c.c);
  const meta=document.querySelector('meta[name="theme-color"]'); if(meta) meta.content=c.c;
  const falta=diasEntre(now.iso,DIAS[0].iso);
  if(Math.abs(diasEntre(now.iso,d.iso))<=15&&!FAKE) pedirClima(d.ck);
  const w=climaDia(d.ck,d.iso);
  const gk=ciudadGPS(),conSitio=p=>p&&p.lat&&!p.hotel;
  const dist=p=>POS&&conSitio(p)?distKm(POS.lat,POS.lon,p.lat,p.lon):null;
  let aqui=null;                              // plan de hoy en cuyo lugar estáis (a menos de 600 m)
  if(esHoy&&POS){
    aqui=items.filter(x=>dist(x.lugar)!=null&&dist(x.lugar)<=0.6)
      .sort((a,b)=>Math.abs((a.t??0)-now.min)-Math.abs((b.t??0)-now.min))[0]||null;
  }

  const cuando=esHoy?"Hoy":falta>0&&sel===0?(falta===1?"Mañana empieza":`Faltan ${falta} días`):d.iso<now.iso?"Ya pasó":"";
  let html=`<div class="hero">
    <div class="hz ${[...c.zh].length>2?"l3":""}" aria-hidden="true">${esc(c.zh)}</div>
    <p class="hd">Día ${sel+1} de ${DIAS.length}${cuando?`<span>${cuando}</span>`:""}</p>
    <h1>${esc(c.n)}</h1>
    <p class="hf">${fecha(d.iso,{weekday:"long",day:"numeric",month:"long"})}</p>
    <div class="hm">
      ${w?`<button data-clima="${d.ck}">${w.ico} ${w.max}° / ${w.min}°${w.pp!=null?`, lluvia ${w.pp}%`:""}</button>`:""}
      <span>China ${fmtMin(now.min)}</span><span>Madrid ${horaMadrid(now)}</span>
      ${CIUDADES[d.ck]?`<button data-ciudad="${d.ck}">Guía de ${esc(c.n)}</button>`:""}
    </div>
  </div>
  <div class="tira" id="tira">${DIAS.map((x,i)=>`<button data-dia="${i}" class="${i===sel?"on":""}${x.iso===now.iso?" hoy":""}" style="--dc:${ciudad(x.Ciudad).c}" aria-label="Día ${i+1}, ${esc(x.Ciudad)}">
      <span>${fecha(x.iso,{weekday:"short"}).slice(0,2)}</span><b>${D(x.iso).getDate()}</b><i></i></button>`).join("")}</div>
  <div class="pad">`;

  /* La ubicación manda sobre el plan */
  if(esHoy&&gk&&gk!==d.ck){
    const otro=DIAS.findIndex(x=>x.ck===gk&&x.iso>=now.iso),ir=otro>=0?otro:DIAS.findIndex(x=>x.ck===gk);
    html+=`<p class="alerta">Estáis en ${esc(CIUDADES[gk].n)}, pero el plan de hoy es ${esc(c.n)}.
      ${ir>=0?`<button class="enl" data-ir="${ir}">Ver el plan de ${esc(CIUDADES[gk].n)}</button>`:""}</p>`;
  }

  /* Ahora y después */
  if(esHoy){
    const conHora=items.filter(x=>x.t!=null);
    const porReloj=[...conHora].reverse().find(x=>x.t<=now.min&&now.min<(x.fin??(conHora[conHora.indexOf(x)+1]||{}).t??x.t+60));
    const actual=aqui||porReloj;
    const sig=aqui?conHora[conHora.indexOf(aqui)+1]:conHora.find(x=>x.t>now.min),tr=proximoTrayecto(now);   // estando en un sitio, lo siguiente es lo que va detrás en el plan
    const dSig=sig?dist(sig.lugar):null;
    html+=`<div class="ahora">
      ${actual?`<div><small>${aqui?"Estáis aquí":"Ahora"}</small><b>${esc(actual.titulo)}</b>${actual.fin&&actual.fin>now.min?`<em>hasta las ${fmtMin(actual.fin)}</em>`:""}</div>`

function mapaRuta(now){
  const ks=[...new Set(DIAS.map(d=>d.ck))].filter(k=>CIUDADES[k]);
  const X=lon=>(lon-101)/22.5*290+20+(lon>114.1&&lon<114.3?9:0),Y=lat=>(41.2-lat)/20.4*330+20+(lat>22.2&&lat<22.4?9:0);   // Hong Kong se separa un poco de Shenzhen
  const pos={pekin:[12,5,"start"],xian:[-12,5,"end"],shanghai:[12,5,"start"],zhangjiajie:[-12,5,"end"],yangshuo:[-12,5,"end"],shenzhen:[-12,0,"end"],hongkong:[13,8,"start"]};
  const hoyK=(DIAS[diaActual(now)]||{}).ck;
  let s=`<svg viewBox="0 0 400 372" role="img" aria-label="Mapa esquemático de la ruta">`;
  ks.forEach((k,i)=>{
    if(!i) return;
    const a=CIUDADES[ks[i-1]],b=CIUDADES[k],t=DATA.transporte.find(t=>claveCiudad(t.Destino)===k);
    const vuelo=t&&/vuelo/i.test(t.Tipo),x1=X(a.lon),y1=Y(a.lat),x2=X(b.lon),y2=Y(b.lat);
    const mx=(x1+x2)/2+(vuelo?(y2-y1)*.18:0),my=(y1+y2)/2-(vuelo?(x2-x1)*.18:0);
    s+=`<path d="M${x1},${y1} Q${mx},${my} ${x2},${y2}" class="${vuelo?"vu":"tr"}"/>`;
  });
  ks.forEach((k,i)=>{
    const c=CIUDADES[k],x=X(c.lon),y=Y(c.lat),[dx,dy,an]=pos[k]||[12,5,"start"];
    s+=`${k===hoyK?`<circle cx="${x}" cy="${y}" r="13" fill="${c.c}" opacity=".2"/>`:""}
      <circle cx="${x}" cy="${y}" r="7" fill="${c.c}"/><text x="${x}" y="${y+3.5}" class="nn">${i+1}</text>
      <text x="${x+dx}" y="${y+dy}" text-anchor="${an}" class="cn">${esc(c.n)} <tspan class="cz">${c.zh}</tspan></text>`;
  });
  return s+`</svg><p class="ley"><span><i class="l1"></i>Tren</span><span><i class="l2"></i>Vuelo</span></p>`;
}

function rangoFechas(ds){

}

function tiraClima(ck){
  const w=WX[ck],g=GUIA[ck]||{},mias=DIAS.filter(d=>d.ck===ck).map(d=>d.iso);
  const habitual=g.clima?`Lo habitual a principios de noviembre: ${g.clima[0]}° de máxima y ${g.clima[1]}° de mínima.`:"";
  if(!w||!w.d||!w.d.time) return `<button class="fila clb" data-clima="${ck}"><span>${habitual||"Sin previsión todavía."}
    <span class="n">La previsión llega unos 16 días antes. Tócalo para consultarla.</span></span></button>`;
  const en=w.d.time.filter(i=>mias.includes(i)),lista=en.length?en:w.d.time.slice(0,7);
  return `<p class="n" style="margin:0 0 8px">${en.length?"Previsión para vuestros días aquí.":"Próximos días; vuestras fechas aún quedan lejos. "+habitual}</p>
    <button class="pv" data-clima="${ck}" aria-label="Ver la previsión completa">${lista.map(iso=>{const x=climaDia(ck,iso);
      return `<span class="${mias.includes(iso)?"vi":""}">${fecha(iso,{weekday:"short",day:"numeric"})}<i>${x.ico}</i><b>${x.max}°</b>${x.min}°</span>`}).join("")}</button>`;
}

    return {tipo:"viaje",hoy:(DIAS[diaActual(ahoraCN())]||{}).ck||null,

      lin:ks.slice(1).map((k,i)=>{const t=DATA.transporte.find(t=>claveCiudad(t.Destino)===k);return {a:ks[i],b:k,v:!!(t&&/vuelo/i.test(t.Tipo))}})};
  }

    const p=g[la+","+lo]||(g[la+","+lo]={lat:la,lon:lo,n:[],t:[],id:x.l.ID,iso:x.o&&x.o.iso});   // sitios con las mismas coordenadas comparten chincheta
    p.n.push(x.n);p.t.push(x.l.Nombre);
  });
  const pts=Object.values(g),dias={};

  return {tipo:"ciudad",c:c.c,centro:[c.lat,c.lon],pts,lin:Object.values(dias).filter(l=>l.length>1)};
}
function curva(a,b){                          // los vuelos se dibujan en arco
  const mla=(a.lat+b.lat)/2-(b.lon-a.lon)*.18,mlo=(a.lon+b.lon)/2+(b.lat-a.lat)*.18,out=[];
  for(let i=0;i<=20;i++){const t=i/20;out.push([(1-t)**2*a.lat+2*(1-t)*t*mla+t*t*b.lat,(1-t)**2*a.lon+2*(1-t)*t*mlo+t*t*b.lon])}
  return out;
}
function dibujarMapa(map,def){
  const oscuro=matchMedia("(prefers-color-scheme: dark)").matches,gris=oscuro?"#9AA1AA":"#636973";
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,
    attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
  const pin=(txt,col)=>L.divIcon({className:"pin",html:`<span style="background:${col}">${txt}</span>`,iconSize:[24,24],iconAnchor:[12,12]});
  if(def.tipo==="viaje"){
    const P=Object.fromEntries(def.pts.map(p=>[p.k,p]));
    def.lin.forEach(l=>{const a=P[l.a],b=P[l.b];
      L.polyline(l.v?curva(a,b):[[a.lat,a.lon],[b.lat,b.lon]],{color:gris,weight:2.5,dashArray:l.v?"3 7":null,interactive:false}).addTo(map)});
    def.pts.forEach(p=>{
      const izq=p.lon<113||p.k==="shenzhen";
      if(p.k===def.hoy) L.circleMarker([p.lat,p.lon],{radius:20,stroke:false,fillColor:p.c,fillOpacity:.25,interactive:false}).addTo(map);
      L.marker([p.lat,p.lon],{icon:pin(p.n,p.c),title:p.t}).addTo(map)
        .bindTooltip(esc(p.t),{permanent:true,direction:izq?"left":"right",offset:[izq?-10:10,0],className:"tt"})
        .on("click",()=>{location.hash="viaje/"+p.k});
    });
    map.fitBounds(def.pts.map(p=>[p.lat,p.lon]),{padding:[30,30]});
  }else{
    def.lin.forEach(l=>L.polyline(l,{color:def.c,weight:3,opacity:.5,interactive:false}).addTo(map));
    def.pts.forEach(p=>L.marker([p.lat,p.lon],{icon:pin(p.n[0]+(p.n.length>1?"+":""),def.c),title:p.t.join(", ")}).addTo(map)
      .bindTooltip(p.t.map(esc).join("<br>"),{direction:"top",offset:[0,-12],className:"tt"}).on("click",()=>detalleLugar(p.id)));
    if(def.pts.length>1) map.fitBounds(def.pts.map(p=>[p.lat,p.lon]),{padding:[30,30],maxZoom:15});
    else map.setView(def.pts[0]?[def.pts[0].lat,def.pts[0].lon]:def.centro,13);
  }
}
function montarMapa(){
  if(tab!=="viaje"||!$("mapaV")) return;
  const def=defMapa(),k=JSON.stringify(def);
  const listo=()=>{                            // vuestra posición se pone aparte, sin rehacer el mapa
    if(MAPA.yo){MAPA.yo.remove();MAPA.yo=null}

  };
  if(MAPA.el&&MAPA.k===k){                     // al repintar se reutiliza el mapa que ya estaba
    if($("mapaV")!==MAPA.el) $("mapaV").replaceWith(MAPA.el);
    MAPA.map.invalidateSize(); listo(); return;
  }
  cargarLeaflet().then(()=>{

    if(MAPA.map) MAPA.map.remove();
    const el=document.createElement("div"); el.id="mapaV"; el.className="lmap on"; ph.replaceWith(el);

    const ph=$("mapaV"); if(ph&&ciudadSel) ph.innerHTML=`<p class="n">El mapa necesita conexión. Los sitios de abajo se abren en Mapas igualmente.</p>`;

}

    <p class="n">${est}${n?` ${n} ${n===1?"cambio pendiente":"cambios pendientes"} de enviar.`:""}</p>
    ${SERVER&&!v2()?`<p class="alerta">Falta actualizar el script de la hoja. Hasta entonces, agenda, gastos y diario se guardan solo en este móvil.</p>`:""}
    <button class="btn" data-act="sync">Sincronizar ahora</button></div>`;
}

/* Teléfonos y correos escritos en el seguro → botones para llamar, escribir o abrir WhatsApp */
function contactos(t){
  let out="";const vistos=new Set();
  String(t||"").split("\n").forEach(linea=>{
    const wa=/whats/i.test(linea);
    (linea.match(/\+?\d[\d ().-]{7,}\d/g)||[]).forEach(x=>{
      const d=x.replace(/[^\d+]/g,""); if(d.replace(/\D/g,"").length<9||vistos.has(d)) return; vistos.add(d);
      out+=wa?`<a class="btn sm" href="https://wa.me/${d.replace(/\D/g,"")}" target="_blank" rel="noopener">WhatsApp ${esc(x.trim())}</a>`
        :`<a class="btn sm" href="tel:${d}">Llamar al ${esc(x.trim())}</a>`;
    });
    (linea.match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/g)||[]).forEach(m=>{if(!vistos.has(m)){vistos.add(m);out+=`<a class="btn sm" href="mailto:${esc(m)}">${esc(m)}</a>`}});
  });
  return out?`<div class="acc" style="margin-top:10px">${out}</div>`:"";
}

const CONSERVAR=["gI","gC","cvI","addT","diarioT","eN","eP","eR"];
function renderAll(forzar){
  const a=document.activeElement;
  if(!forzar&&a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&document.querySelector("main").contains(a)){dirty=true;return}
  dirty=false;
  const y=scrollY,selAntes=sel,vals={};
  CONSERVAR.forEach(id=>{if($(id)) vals[id]=$(id).value});      // lo escrito y aún sin guardar no se pierde
  rHoy();rViaje();rReservas();rGastos();rKit();montarMapa();
  CONSERVAR.forEach(id=>{if($(id)&&vals[id]!=null&&(id!=="diarioT"||sel===selAntes)) $(id).value=vals[id]});
  previaGasto();conversor();
  const n=pendientes(); $("pend").textContent=n?`${n} sin enviar`:""; $("pend").classList.toggle("on",!!n);
  scrollTo(0,y);
}

/* ---------- Calendario (.ics) ---------- */
function exportarICS(){
  const z=n=>String(n).padStart(2,"0");
  const utc=(iso,min)=>{const d=new Date(Date.UTC(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10),0,min-480));
    return `${d.getUTCFullYear()}${z(d.getUTCMonth()+1)}${z(d.getUTCDate())}T${z(d.getUTCHours())}${z(d.getUTCMinutes())}00Z`};
  const t=s=>String(s||"").replace(/\\/g,"\\\\").replace(/[,;]/g,m=>"\\"+m).replace(/\n/g,"\\n");
  let out=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Viaje a China//ES","CALSCALE:GREGORIAN","X-WR-CALNAME:Viaje a China"];
  DIAS.forEach(d=>itemsDia(d.iso).forEach(x=>{
    if(x.t==null) return;
    const fin=x.fin!=null&&x.fin>x.t?x.fin:x.t+60,p=x.lugar;
    out.push("BEGIN:VEVENT",`UID:${x.k.replace(/[^a-z0-9]/gi,"")}-${d.iso}@viaje-china`,`DTSTAMP:${utc(d.iso,0)}`,`DTSTART:${utc(d.iso,x.t)}`,`DTEND:${utc(d.iso,fin)}`,
      `SUMMARY:${t(x.titulo)}`);
    if(p) out.push(`LOCATION:${t([p.nombre,p.zh,p.dir].filter(Boolean).join(" "))}`);
    const desc=[x.notas,p&&p.reserva].filter(Boolean).join(" ");
    if(desc) out.push(`DESCRIPTION:${t(desc)}`);
    const al=x.tipo==="vuelo"?180:x.tipo==="tren"?90:(p&&p.reserva?30:0);
    if(al) out.push("BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${t(x.titulo)}`,`TRIGGER:-PT${al}M`,"END:VALARM");
    out.push("END:VEVENT");
  }));
  out.push("END:VCALENDAR");
  return out.join("\r\n");
}
async function compartirArchivo(file){
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}
  }catch(e){if(e&&e.name==="AbortError") return}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove();
}

/* ---------- Billetes guardados en el móvil (IndexedDB) ---------- */
function bd(){return new Promise((ok,ko)=>{const r=indexedDB.open("china-docs",1);r.onupgradeneeded=()=>r.result.createObjectStore("docs");r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)})}
async function bdOp(modo,fn){const db=await bd();return new Promise((ok,ko)=>{const tx=db.transaction("docs",modo),q=fn(tx.objectStore("docs"));tx.oncomplete=()=>ok(q&&q.result);tx.onerror=()=>ko(tx.error)})}
async function cargarDocs(){try{DOCS=new Set(await bdOp("readonly",s=>s.getAllKeys()));renderAll()}catch(e){}}
async function verDoc(k){
  try{
    const d=await bdOp("readonly",s=>s.get(k)); if(!d) return;
    const file=new File([d.blob],d.name||"billete",{type:d.type});
    if(/^image\//.test(d.type)){
      $("grande").innerHTML=`<button class="x" data-act="cerrar-grande">Cerrar</button><img src="${URL.createObjectURL(file)}" alt="Billete guardado">`;
      $("grande").classList.add("on");
    }else await compartirArchivo(file);
  }catch(e){aviso("No se ha podido abrir el billete.")}
}

/* ---------- Eventos ---------- */
const TABS=["hoy","viaje","reservas","gastos","kit"];
function mostrar(t){
  tab=t;
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x.dataset.t===t));
  document.querySelectorAll("main>section").forEach(s=>s.classList.toggle("on",s.id===t));
  montarMapa();
}
function ruta(){                              // la dirección manda: #viaje/pekin abre la guía de Pekín
  const [t,s]=decodeURIComponent(location.hash.slice(1)).split("/"),T=TABS.includes(t)?t:"hoy";
  if(T==="viaje"){const c=s&&CIUDADES[s]?s:null;if(c!==ciudadSel){ciudadSel=c;rViaje()}}
  if(T==="reservas"&&["hoteles","transporte","entradas"].includes(s)&&s!==resTab){resTab=s;rReservas()}
  mostrar(T);scrollTo(0,0);
}
function irA(t){if(location.hash.slice(1)===t) ruta(); else location.hash=t}
addEventListener("hashchange",()=>{cerrarHoja();ruta()});
document.querySelector("nav").addEventListener("click",e=>{const b=e.target.closest("button");if(b) irA(b.dataset.t)});

document.addEventListener("click",async e=>{
  const q=s=>e.target.closest(s);
  let b;
  if(b=q("[data-dia]")){sel=+b.dataset.dia;selManual=sel!==diaActual(ahoraCN());rHoy();return}
  if(b=q("[data-ir]")){sel=+b.dataset.ir;selManual=true;cerrarHoja();rHoy();irA("hoy");return}
  if(b=q("[data-ciudad]")){location.hash="viaje/"+b.dataset.ciudad;return}
  if(b=q("[data-clima]")) return climaHoja(b.dataset.clima);
  if(b=q("[data-lugar]")) return detalleLugar(b.dataset.lugar);
  if(b=q("[data-taxi-lugar]")){const l=DATA.lugares.find(x=>x.ID===b.dataset.taxiLugar);if(l) taxista(lugarDe(l.Nombre));return}
  if(b=q("[data-item]")) return detalleItem(b.dataset.item);
  if(b=q("[data-taxi-item]")){const x=itemsDia(DIAS[sel].iso).find(i=>i.k===b.dataset.taxiItem);if(x&&x.lugar) taxista(x.lugar);return}
  if(b=q("[data-taxi-hotel]")){const h=DATA.alojamiento.find(h=>h.Ciudad===b.dataset.hk);if(h) taxista(lugarHotel(h));return}
  if(b=q("[data-editar-agenda]")) return formAgenda(b.dataset.editarAgenda);
  if(b=q("[data-borrar-agenda]")){cerrarHoja();mutar({action:"remove",sheet:"Agenda",id:b.dataset.borrarAgenda});aviso("Plan borrado");return}
  if(b=q("[data-borrar-gasto]")){mutar({action:"remove",sheet:"Gastos",id:b.dataset.borrarGasto});aviso("Gasto borrado");return}
  if(b=q("[data-edit]")) return formFila(b.dataset.edit,+b.dataset.row);
  if(b=q("[data-res]")){resTab=b.dataset.res;history.replaceState(null,"","#reservas/"+resTab);rReservas();return}
  if(b=q("[data-mon]")){gMon=b.dataset.mon;$("gM").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));previaGasto();return}
  if(b=q("[data-cat]")){gCat=b.dataset.cat;$("gK").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));return}
  if(b=q("[data-pag]")){gPag=b.dataset.pag;LS.set("china-yo",gPag);$("gP").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));return}
  if(b=q("[data-frase]")) return grande(b.dataset.frase,b.dataset.es,b.dataset.py);
  if(b=q("[data-ver-doc]")) return verDoc(b.dataset.verDoc);
  if(b=q("[data-quitar-doc]")){await bdOp("readwrite",s=>s.delete(b.dataset.quitarDoc)).catch(()=>{});return cargarDocs()}
  if(b=q("[data-act]")){
    const a=b.dataset.act;
    if(a==="cerrar") cerrarHoja();
    if(a==="cerrar-grande") $("grande").classList.remove("on");
    if(a==="volver") location.hash="viaje";
    if(a==="nuevo-agenda") formAgenda(null);
    if(a==="sync") sincronizar(true);
    if(a==="geo"){ubicar(true);renderAll()}
    if(a==="ics") compartirArchivo(new File([exportarICS()],"viaje-china.ics",{type:"text/calendar"}));
  }
});
$("dlg").addEventListener("click",e=>{if(e.target===$("dlg")) cerrarHoja()});

function previaGasto(){
  const n=num($("gI").value);
  $("gE").textContent=n&&gMon!=="EUR"?`${dinero(n,gMon)} son ${eur(aEUR(n,gMon))}`:`1 EUR = ${FX.CNY.toFixed(2)} CNY = ${FX.HKD.toFixed(2)} HKD`;
}
document.addEventListener("input",e=>{
  if(e.target.id==="gI") previaGasto();
  if(e.target.id==="cvI") conversor();
});
function conversor(){
  const n=num($("cvI").value);
  $("cvO").innerHTML=n?`<b>${dinero(n,"CNY")}</b> son ${eur(aEUR(n,"CNY"))}<br><b>${dinero(n,"HKD")}</b> son ${eur(aEUR(n,"HKD"))}<br><b>${eur(n)}</b> son ${dinero(n*FX.CNY,"CNY")} o ${dinero(n*FX.HKD,"HKD")}`
    :"Escribe un importe en yuanes o dólares de Hong Kong.";
}
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.matches("[data-ent]")){
    mutar({action:"upsert",sheet:"Ajustes",id:"ent:"+t.dataset.ent,values:{Valor:t.checked?"1":""}});return;
  }
  if(t.matches(".chk input")){
    const c=DATA.checklist.find(x=>x._row===+t.dataset.row); if(!c) return;
    mutar({action:"check",row:c._row,key:c._k,done:t.checked});
  }
  if(t.matches("[data-doc]")&&t.files[0]){
    const f=t.files[0];
    try{await bdOp("readwrite",s=>s.put({name:f.name,type:f.type,blob:f},t.dataset.doc));aviso("Billete guardado en este móvil");cargarDocs()}
    catch(err){aviso("No se ha podido guardar el billete.")}
  }
});
document.addEventListener("submit",e=>{
  const f=e.target.closest("[data-form]"); if(!f) return;
  e.preventDefault();
  const tipo=f.dataset.form,d=DIAS[sel];
  if(tipo==="diario"){
    mutar({action:"upsert",sheet:"Diario",id:"d"+d.iso.replace(/-/g,""),values:{Fecha:d.iso,Nota:$("diarioT").value.trim()}});aviso("Nota guardada");
  }else if(tipo==="agenda"){
    const id=f.dataset.id||"a"+Date.now().toString(36);
    mutar({action:"upsert",sheet:"Agenda",id,values:{Fecha:d.iso,Hora:$("aH").value,Fin:$("aF").value,"Qué":$("aQ").value.trim(),Lugar:$("aL").value.trim(),Tipo:$("aT").value,Notas:$("aN").value.trim()}});
    cerrarHoja();aviso("Agenda actualizada");
  }else if(tipo==="fila"){
    const sheet=f.dataset.sheet,r=DATA[sheet.toLowerCase()].find(x=>x._row===+f.dataset.row),values={};
    camposDe(sheet).forEach(([k,,t],i)=>{const v=$("f"+i).value.trim();values[k]=t==="num"?(v===""?"":num(v)??""):v});
    mutar({action:"update",sheet,row:r._row,key:r._k,values});cerrarHoja();aviso("Cambios guardados");
  }else if(tipo==="gasto"){
    const n=num($("gI").value); if(!n||n<=0){aviso("Escribe un importe");return}
    const now=ahoraCN(),dia=DIAS.find(x=>x.iso===now.iso),concepto=$("gC").value.trim();
    $("gI").value="";$("gC").value="";
    mutar({action:"upsert",sheet:"Gastos",id:"g"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
      values:{Fecha:now.iso,Ciudad:ciudadGPS()?CIUDADES[ciudadGPS()].n:dia?ciudad(dia.Ciudad).n:"Antes del viaje",Concepto:concepto,"Categoría":gCat,Importe:n,Moneda:gMon,EUR:Math.round(aEUR(n,gMon)*100)/100,"Pagó":gPag}});
    aviso("Gasto añadido");
  }else if(tipo==="tarea"){
    const t=$("addT").value.trim(); $("addT").value=""; if(t){mutar({action:"addTask",text:t});aviso("Tarea añadida")}
  }else if(tipo==="entrada"){
    const k=$("eC").value,nombre=$("eN").value.trim(); if(!nombre) return;
    mutar({action:"upsert",sheet:"Lugares",id:"l"+Date.now().toString(36),values:{Ciudad:CIUDADES[k].n,Nombre:nombre,Chino:"","Dirección":"",Horario:"",
      Precio:$("eP").value.trim(),Reserva:$("eR").value.trim()||"Comprar antes de ir",Notas:"",Lat:"",Lon:""}});
    $("eN").value=$("eP").value=$("eR").value="";aviso("Entrada añadida");
  }else if(tipo==="seguro"){
    mutar({action:"upsert",sheet:"Ajustes",id:"seguro",values:{Valor:$("segT").value.trim()}});aviso("Datos guardados");
  }else if(tipo==="personas"){
    mutar({action:"upsert",sheet:"Ajustes",id:"p1",values:{Valor:$("pe1").value.trim()}});
    mutar({action:"upsert",sheet:"Ajustes",id:"p2",values:{Valor:$("pe2").value.trim()}});aviso("Nombres guardados");
  }
});
document.addEventListener("focusout",()=>{if(dirty) setTimeout(()=>renderAll(),80)});
addEventListener("online",()=>sincronizar());
document.addEventListener("visibilitychange",()=>{if(!document.hidden){sincronizar();pedirCambio()}});
setInterval(()=>{                       // el reloj avanza: se repinta solo la pantalla del día
  if(tab==="hoy"){const t0=tab;tab="";repintarHoy();tab=t0}
  if(QUEUE.length) enviar();
},30000);

rebuild();
renderAll(true);
if(location.hash.length>1) ruta();
sincronizar();
pedirCambio();
cargarDocs();
if(LS.get("china-geo")==="1"||PARAMS.get("pos")) ubicar(false);
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
