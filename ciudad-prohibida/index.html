<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<script>try{var t=localStorage.getItem("china-tema");if(t==="oscuro"||(t!=="claro"&&matchMedia("(prefers-color-scheme: dark)").matches)){document.documentElement.dataset.tema="oscuro";document.querySelector('meta[name="theme-color"]').content="#0F172A"}}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ciudad Prohibida">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../icon-180.png">
<title>Ciudad Prohibida · Audioguía</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="../audioguia/guia.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="volver" href="../#viaje/pekin" aria-label="Volver a la app del viaje"><i class="fa-solid fa-arrow-left"></i></a>
    <span class="logo" aria-hidden="true">宫</span>
    <div class="tit"><h1>Ciudad Prohibida</h1><p id="sub">Audioguía · 故宫 · unas 3 horas</p></div>
    <button class="ico" data-act="ajustes" aria-label="Ajustes de la audioguía"><i class="fa-solid fa-sliders"></i></button>
  </div>
</header>

<main>
  <section class="portada" id="portada"></section>
  <div id="llegada"></div>
  <div class="estado" id="estado"></div>
  <div class="mapaW">
    <div id="mapa" role="region" aria-label="Mapa de la visita"></div>
    <div class="mapaB">
      <button data-act="seguir" id="bSeguir" aria-label="Seguir mi posición"><i class="fa-solid fa-location-crosshairs"></i></button>
      <button data-act="encuadrar" aria-label="Ver toda la ruta"><i class="fa-solid fa-expand"></i></button>
    </div>
  </div>
  <p class="lbl"><i class="fa-solid fa-headphones"></i>Las paradas, de sur a norte</p>
  <div id="paradas" style="display:grid;gap:10px"></div>
  <p class="n" style="padding:0 4px">Mapa © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>. La posición de cada parada es aproximada (unos 20–30 m). Horarios y precios orientativos.</p>
</main>

<div class="repro" id="repro"></div>
<dialog id="dlg"><div class="hoja" id="hoja"></div></dialog>
<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<script src="guion.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ============================================================
   RECORRIDO
   Coordenadas en WGS-84 (las del GPS del iPhone y las de OpenStreetMap);
   el eje central del palacio está en la longitud 116.3907.
   [id, nombre, chino, pinyin, lat, lon, minutos, radio de aviso (m), búsqueda en Mapas, cómo llegar]
   ============================================================ */
const CFG={
 clave:"cp",                                // prefijo de lo guardado en el móvil
 titulo:"La Ciudad Prohibida",zh:"紫禁城",
 texto:n=>`Recorrido a pie de sur a norte, de Tiananmen a la Colina de Carbón, con ${n} historias: qué estáis viendo, curiosidades, leyendas, mitos y escándalos de 500 años de emperadores, concubinas y eunucos.`,
 saludo:"Bienvenidos a la Ciudad Prohibida, el palacio de los emperadores de China.",
 limites:[[39.9068,116.3860],[39.9245,116.3955]],
 ruta:[
 ["intro","Antes de entrar","故宫","Gùgōng",null,null,6,0,"故宫博物院",
  "Escuchadla mientras hacéis cola o cruzáis la plaza de Tiananmen. No hace falta estar en ningún sitio concreto."],
 ["tiananmen","Puerta de Tiananmen","天安门","Tiān'ānmén",39.9072,116.3908,10,60,"天安门城楼",
  "Situaos frente a la puerta, junto a los puentes de mármol del foso, mirando al norte: el retrato de Mao queda encima de la puerta central."],
 ["duanmen","Puerta Duanmen","端门","Duānmén",39.9100,116.3907,8,45,"端门 北京",
  "Cruzad Tiananmen por debajo y seguid recto hacia el norte unos 200 metros por el patio largo. La siguiente puerta, casi idéntica, es Duanmen."],
 ["wumen","Puerta Meridiana","午门","Wǔmén",39.9120,116.3907,10,45,"故宫 午门",
  "Pasada Duanmen, seguid recto hasta la explanada en forma de U. Aquí está el control de entradas con el pasaporte."],
 ["taihemen","Río de las Aguas Doradas y Puerta de la Armonía Suprema","太和门","Tàihémén",39.9140,116.3907,8,45,"故宫 太和门",
  "Al salir de los túneles de la Puerta Meridiana veréis el gran patio con el río curvo y sus cinco puentes. Cruzadlos y deteneos ante la puerta con los dos leones de bronce."],
 ["taihedian","Salón de la Armonía Suprema","太和殿","Tàihédiàn",39.9156,116.3907,16,60,"故宫 太和殿",
  "Cruzad la Puerta de la Armonía Suprema: delante se abre la explanada más grande del palacio. Subid hasta el pie de la triple terraza de mármol."],
 ["zhonghe_baohe","Salones de la Armonía Central y Preservada","保和殿","Bǎohédiàn",39.9171,116.3907,15,45,"故宫 保和殿",
  "Rodead el gran salón por cualquiera de los lados y seguid por la terraza hacia el norte: primero el pequeño salón cuadrado, después el tercero. Acabad detrás, junto a la rampa de mármol tallado."],
 ["jiulongbi","Muro de los Nueve Dragones","九龙壁","Jiǔlóngbì",39.9163,116.3937,9,40,"故宫 九龙壁",
  "Bajad de la terraza hacia el este, salid por la puerta lateral del patio y seguid las señales de «Treasure Gallery» unos 300 metros. El muro de cerámica está frente a la taquilla de la Galería del Tesoro."],
 ["tesoro","Galería del Tesoro y Palacio de la Longevidad Tranquila","珍宝馆","Zhēnbǎoguǎn",39.9180,116.3937,18,55,"故宫 珍宝馆",
  "Comprad la entrada extra (unos 10 yuanes) junto al Muro de los Nueve Dragones y entrad. El recorrido avanza hacia el norte por los palacios de retiro de Qianlong."],
 ["pozo_zhen","Pozo de la concubina Zhen","珍妃井","Zhēnfēi jǐng",39.9206,116.3940,6,35,"故宫 珍妃井",
  "Al final del recorrido del Tesoro, casi en el extremo norte del sector, hay un pequeño patio con un pozo cubierto por una losa. Ese es."],
 ["relojes","Salón de los Relojes","钟表馆","Zhōngbiǎoguǎn",39.9178,116.3924,12,40,"故宫 钟表馆",
  "Salid del sector del Tesoro hacia el oeste y bajad unos 300 metros hacia el sur por el callejón. El Salón de los Relojes (Fengxiandian) tiene taquilla propia, unos 10 yuanes."],
 ["qianqinggong","Puerta y Palacio de la Pureza Celestial","乾清宫","Qiánqīnggōng",39.9188,116.3907,14,45,"故宫 乾清宫",
  "Volved al eje central por la puerta de Jingyun, hacia el oeste. Os encontraréis frente a la Puerta de la Pureza Celestial: entrad y deteneos ante el palacio."],
 ["jiaotai_kunning","Salón de la Unión y Palacio de la Tranquilidad Terrenal","坤宁宫","Kūnnínggōng",39.9199,116.3907,10,40,"故宫 坤宁宫",
  "Seguid hacia el norte por el eje: el pequeño salón cuadrado es el de la Unión; justo detrás está el Palacio de la Tranquilidad Terrenal."],
 ["yangxindian","Salón del Cultivo Mental","养心殿","Yǎngxīndiàn",39.9186,116.3885,12,40,"故宫 养心殿",
  "Volved un poco hacia el sur y salid del patio del Palacio de la Pureza Celestial por la puerta del oeste. El Salón del Cultivo Mental queda a unos 150 metros, hacia el suroeste."],
 ["palacios_oeste","Seis Palacios del Oeste","储秀宫","Chǔxiùgōng",39.9198,116.3882,12,50,"故宫 储秀宫",
  "Desde el Salón del Cultivo Mental, subid hacia el norte por el callejón largo. Los patios a ambos lados son los seis palacios de las concubinas; buscad el Palacio de la Elegancia Acumulada."],
 ["jardin","Jardín Imperial","御花园","Yùhuāyuán",39.9207,116.3907,12,55,"故宫 御花园",
  "Desde los palacios del oeste, id hacia el este y el norte hasta el jardín, detrás del Palacio de la Tranquilidad Terrenal."],
 ["shenwumen","Puerta del Poderío Divino","神武门","Shénwǔmén",39.9218,116.3907,8,50,"故宫 神武门",
  "Salid del jardín hacia el norte y cruzad la Puerta del Poderío Divino. Ya fuera, poneos junto al foso y mirad hacia las esquinas de la muralla."],
 ["jingshan","Colina de Carbón (Parque Jingshan)","景山","Jǐngshān",39.9240,116.3907,15,70,"景山公园 万春亭",
  "Cruzad la calle por el paso subterráneo hasta la puerta sur del Parque Jingshan (unos 2 yuanes) y subid hasta el pabellón más alto, el del centro."]
 ],
 // Muralla y foso, para que el mapa sirva aunque no carguen las teselas
 muralla:[[39.9125,116.3863],[39.9125,116.3951],[39.9212,116.3951],[39.9212,116.3863]],
 foso:[[39.9120,116.3858],[39.9120,116.3956],[39.9217,116.3956],[39.9217,116.3858]],
 zona:[[39.905,116.383],[39.926,116.398]]      // lo que se descarga para usar sin conexión
};

</script>
<script src="../audioguia/guia.js"></script>
</body>
</html>
